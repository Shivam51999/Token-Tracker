<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launch Pulse — Token Pattern &amp; Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* clean light surface, matching the Mangalam HQ portal */
    --paper:#FAFAFB;
    --surface:#FFFFFF;
    --surface-2:#F4F5F7;
    --raise:#ECEEF1;
    --ink:#1A1D23;
    --ink-2:#42474F;
    --muted:#6B7280;
    --faint:#9AA1AC;
    --rule:#E8EAED;
    --rule-2:#D9DCE1;
    /* Mangalam brand red, plus supporting signal colors */
    --accent:#E2352F;
    --accent-2:#C22821;
    --accent-soft:rgba(226,53,47,.08);
    --pos:#1E9E5A;
    --pos-soft:rgba(30,158,90,.08);
    --neg:#D9342B;
    --neg-soft:rgba(217,52,43,.08);
    --info:#2563EB;
    --info-soft:rgba(37,99,235,.08);
    /* glow tokens kept for compatibility — flat theme, no glow */
    --glow-accent:none;
    --glow-pos:none;
    --glow-neg:none;
    --r:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-size:14px; line-height:1.5;
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }

  /* flat light surface — no texture overlays needed to match the HQ portal */
  .mono{font-family:'Inter',system-ui,sans-serif; font-variant-numeric:tabular-nums;}
  #app{position:relative; z-index:1; max-width:1360px; margin:0 auto; padding:0 26px 96px;}
  button{font-family:inherit;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:6px;}

  /* ---------------------------------------------------------------- nav */
  .nav{
    position:sticky; top:0; z-index:40; margin:0 -26px; padding:15px 26px 0;
    background:rgba(255,255,255,.92);border-bottom:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:10px;padding-bottom:13px;}
  .brand h1{
    margin:0; font-family:'Inter',system-ui,sans-serif; font-size:19px; font-weight:600;
    letter-spacing:-.2px; color:var(--ink);
  }
  .vtag{
    font-family:'Inter',system-ui,sans-serif; font-size:10px; letter-spacing:.4px;
    color:var(--muted); border:1px solid var(--rule-2); padding:1px 5px; border-radius:3px;
  }
  /* the neon lives here: active tab gets a lit underline plus a soft bloom */
  .navtabs{display:flex;gap:2px;flex-wrap:wrap;align-self:flex-end;}
  .navtabs button{
    position:relative;background:none;border:none;color:var(--muted);
    padding:9px 15px 12px;font-size:13.5px;font-weight:500;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:color .16s;
  }
  .navtabs button .g{font-size:11px;opacity:.7;}
  .navtabs button::after{
    content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;border-radius:2px;
    background:var(--accent);opacity:0;transform:scaleX(.4);
    transition:opacity .18s ease,transform .18s ease,box-shadow .18s ease;
  }
  .navtabs button:hover{color:var(--ink-2);}
  .navtabs button:hover::after{opacity:.32;transform:scaleX(.8);}
  .navtabs button.active{color:var(--accent);font-weight:600;}
  .navtabs button.active::after{opacity:1;transform:scaleX(1);box-shadow:none;}
  @keyframes breathe{0%,100%{opacity:1;}50%{opacity:1;}}
  .nav-sp{flex:1;}
  .status{
    display:inline-flex;align-items:center;gap:8px;padding-bottom:13px;
    font-family:'Inter',system-ui,sans-serif;font-size:11.5px;color:var(--muted);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--pos);flex-shrink:0;}
  .dot.pulse{animation:p 2.6s ease-in-out infinite;}
  @keyframes p{0%,100%{opacity:1;}50%{opacity:.5;}}

  .subnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:18px 0 0;}
  .subnav .lbl{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin-right:4px;}
  .subnav button{
    background:var(--surface);border:1px solid var(--rule-2);color:var(--ink-2);
    padding:6px 14px;border-radius:100px;font-size:13px;font-weight:500;cursor:pointer;
    transition:border-color .16s,box-shadow .16s,color .16s;
  }
  .subnav button:hover{color:var(--ink);border-color:var(--muted);}
  .subnav button.active{
    color:#FFFFFF;background:var(--accent);border-color:var(--accent-2);font-weight:600;
  }
  .subnav .add{color:var(--accent);border-style:dashed;background:transparent;}

  /* --------------------------------------------------------------- hero */
  .hero{
    position:relative; overflow:hidden;
    margin:20px 0 18px; border:1px solid var(--rule); border-radius:var(--r);
    background:var(--surface);
    box-shadow:var(--shadow);
    padding:30px 32px 28px;
    display:grid; grid-template-columns:1fr 200px 300px; gap:36px; align-items:center;
  }
  .hero::before{
    content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),var(--info),transparent);
  }
  @media(max-width:1100px){ .hero{grid-template-columns:1fr;} }
  .hero-num{
    font-family:'Inter',system-ui,sans-serif; font-weight:600; font-size:68px; line-height:.98;
    letter-spacing:-1.5px; color:var(--ink); font-variant-numeric:tabular-nums;
    
  }
  .hero-num .u{
    font-family:'Inter',sans-serif; font-size:17px; font-weight:500; color:var(--accent);
    margin-left:12px; letter-spacing:0;
  }
  .hero-num .sub{color:var(--faint);font-weight:400;text-shadow:none;}
  @media(max-width:640px){ .hero-num{font-size:50px;} }
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px;}
  .chip{
    border:1px solid var(--rule-2);background:rgba(0,0,0,.015);border-radius:100px;
    padding:5px 13px;font-size:12.5px;color:var(--muted);
  }
  .chip b{color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-weight:500;}
  .chip.hot{border-color:rgba(226,53,47,.35);background:var(--accent-soft);color:var(--accent-2);}
  .chip.hot b{color:var(--accent-2);}
  .chip.bad{border-color:rgba(217,52,43,.35);background:var(--neg-soft);color:var(--neg);}
  .chip.bad b{color:var(--neg);}
  .chip.good{border-color:rgba(30,158,90,.35);background:var(--pos-soft);color:var(--pos);}
  .chip.good b{color:var(--pos);}

  .callout{
    margin-top:20px;padding:14px 18px;border-left:3px solid var(--accent);
    background:linear-gradient(90deg,rgba(226,53,47,.05),transparent 72%);
    border-radius:0 var(--r) var(--r) 0;font-size:13.5px;line-height:1.65;color:var(--ink-2);
    
  }
  .callout b{color:var(--ink);font-weight:600;}
  .callout.good{border-left-color:var(--pos);background:linear-gradient(90deg,rgba(30,158,90,.06),transparent 72%);}
  .callout.bad{border-left-color:var(--neg);background:linear-gradient(90deg,rgba(217,52,43,.06),transparent 72%);}

  /* gauge — the ring is the brightest thing on the page, on purpose */
  .gauge{display:flex;align-items:center;justify-content:center;position:relative;}
  .gauge svg{filter:drop-shadow(0 1px 2px rgba(16,24,40,.08));}
  .gauge .val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
  .gauge .val .n{
    font-family:'Inter',system-ui,sans-serif;font-size:40px;font-weight:600;
    color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;
  }
  .gauge .val .t{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);margin-top:8px;}

  /* score bars */
  .scores{display:flex;flex-direction:column;gap:12px;}
  .score{display:grid;grid-template-columns:1fr 120px 30px;align-items:center;gap:14px;font-size:12.5px;}
  .score .nm{color:var(--ink-2);}
  .score .bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;}
  .score .bar>i{display:block;height:100%;border-radius:2px;transition:width .7s cubic-bezier(.22,.9,.35,1);}
  .score .n{font-family:'Inter',system-ui,sans-serif;text-align:right;color:var(--ink);font-size:12.5px;}
  .s-good{background:var(--pos);}
  .s-mid{background:var(--accent);}
  .s-bad{background:var(--neg);}

  /* ------------------------------------------------------------ kpi row */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:14px;margin-bottom:18px;}
  .kcard{
    border:1px solid var(--rule);border-radius:var(--r);
    background:var(--surface);
    box-shadow:var(--shadow);padding:16px 18px 0;overflow:hidden;display:flex;flex-direction:column;
    transition:border-color .16s;
  }
  .kcard{position:relative;}
  /* a lit hairline across the top edge of every metric card */
  .kcard::before{
    content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(226,53,47,.35),transparent);
    opacity:.55;transition:opacity .2s;
  }
  .kcard:hover{border-color:rgba(226,53,47,.30);box-shadow:var(--shadow);}
  .kcard:hover::before{opacity:1;}
  .kcard .lbl{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);margin-bottom:12px;}
  .kcard .big{
    font-family:'Inter',system-ui,sans-serif;font-size:27px;font-weight:500;line-height:1;
    letter-spacing:-.8px;color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .kcard .big small{font-size:14px;color:var(--faint);font-weight:400;letter-spacing:0;}
  .kcard .foot{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5;min-height:18px;}
  .kcard .foot b{color:var(--ink);font-weight:600;}
  .kcard .spark{margin:14px -18px 0;line-height:0;}
  .kcard .spark svg{width:100%;height:44px;display:block;}
  .c-amber{color:var(--accent);}
  .c-mint{color:var(--pos);}
  .c-cyan{color:var(--info);}
  .c-violet{color:var(--info);}
  .c-coral{color:var(--neg);}
  .c-muted{color:var(--muted);}
  .up{color:var(--pos);} .down{color:var(--neg);} .flat{color:var(--faint);}

  /* ------------------------------------------------------------- panels */
  .panel{
    background:var(--surface);
    border:1px solid var(--rule);border-radius:var(--r);
    box-shadow:var(--shadow);padding:20px 22px 22px;
    transition:border-color .22s,box-shadow .22s;
  }
  .panel:hover{border-color:rgba(226,53,47,.22);box-shadow:var(--shadow);}
  .p-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:2px;flex-wrap:wrap;}
  .panel h3{
    margin:0;font-family:'Inter',system-ui,sans-serif;font-size:16px;font-weight:600;
    letter-spacing:-.2px;color:var(--ink);display:flex;align-items:baseline;gap:9px;
  }
  .panel h3 .cnt{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:400;color:var(--faint);}
  .p-note{color:var(--muted);font-size:12.5px;margin:8px 0 18px;line-height:1.6;max-width:76ch;}
  .grid2{display:grid;grid-template-columns:1.18fr .82fr;gap:16px;margin-bottom:16px;}
  .grid2.even{grid-template-columns:1fr 1fr;}
  @media(max-width:1000px){ .grid2,.grid2.even{grid-template-columns:1fr;} }

  .pill{
    display:inline-flex;align-items:center;padding:3px 11px;border-radius:100px;
    font-size:11px;font-weight:600;letter-spacing:.2px;
    border:1px solid var(--rule-2);color:var(--muted);white-space:nowrap;
  }
  .pill.good{color:var(--pos);border-color:rgba(30,158,90,.32);background:var(--pos-soft);}
  .pill.warn{color:var(--accent-2);border-color:rgba(226,53,47,.32);background:var(--accent-soft);}
  .pill.bad{color:var(--neg);border-color:rgba(217,52,43,.32);background:var(--neg-soft);}

  /* pace rails */
  .pace{display:grid;grid-template-columns:1fr 300px;gap:26px;}
  @media(max-width:960px){ .pace{grid-template-columns:1fr;} }
  .pace-chart{height:270px;position:relative;}
  .rails{display:flex;flex-direction:column;gap:18px;justify-content:center;}
  .rail-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:7px;gap:8px;}
  .rail-top .nm{color:var(--muted);}
  .rail-top .nums{font-family:'Inter',system-ui,sans-serif;}
  .rail-top .nums .have{color:var(--ink);font-weight:500;}
  .rail-top .nums .of{color:var(--faint);}
  .track{height:5px;background:var(--rule);border-radius:3px;overflow:hidden;position:relative;}
  .track>.fill{height:100%;border-radius:3px;background:var(--pos);transition:width .7s cubic-bezier(.22,.9,.35,1);}
  .track>.fill.behind{background:var(--accent);}
  .track>.fill.bad{background:var(--neg);}
  .track>.tick{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--ink);opacity:.5;}
  .rail-foot{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.55;}
  .rail-foot b{color:var(--ink);font-weight:600;}
  .cdrow{display:flex;gap:32px;flex-wrap:wrap;}
  .cd .n{
    font-family:'Inter',system-ui,sans-serif;font-size:34px;font-weight:600;line-height:1;
    color:var(--accent);font-variant-numeric:tabular-nums;
  }
  .cd .n.bad{color:var(--neg);}
  .cd .l{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin-top:9px;}
  .cd .s{font-size:11.5px;color:var(--muted);margin-top:5px;}

  /* insights */
  .ins-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--rule);}
  .ins-item:last-child{border-bottom:none;}
  .ins-tag{flex-shrink:0;width:3px;border-radius:2px;background:var(--rule-2);}
  .ins-tag.win{background:var(--pos);}
  .ins-tag.risk{background:var(--neg);}
  .ins-tag.watch{background:var(--accent);}
  .ins-tag.data{background:var(--info);}
  .ins-body h4{margin:0 0 4px;font-size:13.5px;font-weight:600;color:var(--ink);}
  .ins-body p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.65;}
  .ins-body b{color:var(--ink);font-weight:600;}

  /* forms */
  .form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:96px;}
  .field label{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);}
  .field input,.field select{
    background:var(--paper);border:1px solid var(--rule-2);color:var(--ink);
    border-radius:5px;padding:9px 11px;font-family:inherit;font-size:13.5px;width:100%;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(226,53,47,.12);}
  .rg{border:1px solid var(--rule);border-radius:var(--r);padding:14px;margin-bottom:12px;background:var(--surface-2);}
  .rg-title{
    font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);
    margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;font-weight:600;
  }
  .rg-title .hint{color:var(--faint);font-weight:400;letter-spacing:.3px;}
  .subs{display:flex;flex-direction:column;gap:8px;}
  .sub-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;background:var(--surface-2);border:1px solid var(--rule);border-radius:5px;padding:10px;}
  .sub-row .field{min-width:88px;}
  .sub-row .rownum{
    flex-shrink:0;align-self:center;width:22px;height:22px;border-radius:50%;
    background:var(--raise);border:1px solid var(--rule-2);color:var(--muted);
    font-family:'Inter',system-ui,sans-serif;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn{background:var(--surface);border:1px solid var(--rule-2);color:var(--muted);border-radius:5px;width:34px;height:34px;cursor:pointer;font-size:15px;flex-shrink:0;}
  .icon-btn:hover{color:var(--neg);border-color:var(--neg);}
  .link-btn{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;}
  .link-btn:hover{color:var(--accent-2);}
  .link-btn.muted{color:var(--muted);} .link-btn.danger{color:var(--neg);}
  .primary-btn{
    background:var(--accent);color:#FFFFFF;border:none;border-radius:5px;padding:11px 20px;
    font-weight:600;font-size:13.5px;cursor:pointer;margin-top:6px;
  }
  .primary-btn:hover{background:var(--accent-2);}
  .primary-btn:disabled{opacity:.4;cursor:default;box-shadow:none;}
  .ghost-btn{background:var(--surface);border:1px solid var(--rule-2);color:var(--ink-2);border-radius:5px;padding:9px 17px;font-size:13px;font-weight:500;cursor:pointer;}
  .ghost-btn:hover{border-color:var(--muted);}
  .danger-btn{background:transparent;border:1px solid rgba(217,52,43,.35);color:var(--neg);border-radius:5px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;}
  .editing{border:1px solid rgba(226,53,47,.32);background:var(--accent-soft);border-radius:5px;padding:11px 14px;margin-bottom:12px;font-size:12.5px;color:var(--accent-2);display:flex;justify-content:space-between;gap:10px;align-items:center;}

  .legend{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  @media(max-width:640px){ .legend{grid-template-columns:1fr;} }
  .lg{border:1px solid var(--rule);border-radius:5px;padding:12px 13px;background:var(--surface-2);}
  .lg .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:6px;}
  .lg .nm{font-weight:600;font-size:13px;}
  .lg .amt{font-family:'Inter',system-ui,sans-serif;font-size:12px;color:var(--ink-2);}
  .lg .tm{font-size:11.5px;color:var(--muted);line-height:1.55;}
  .lg.silver .nm{color:#A9B4BF;} .lg.gold .nm{color:var(--accent);} .lg.platinum .nm{color:var(--info);}

  /* log */
  .log{display:flex;flex-direction:column;max-height:440px;overflow-y:auto;padding-right:6px;}
  .log-item{padding:13px 0;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;}
  .log-item:last-child{border-bottom:none;}
  .log-item .d{font-family:'Inter',system-ui,sans-serif;font-size:12px;color:var(--ink-2);min-width:76px;}
  .log-item .d small{display:block;color:var(--faint);font-size:10.5px;margin-top:3px;}
  .log-item .st{font-size:13px;flex:1;color:var(--ink-2);}
  .log-item .st .n{color:var(--accent);font-family:'Inter',system-ui,sans-serif;font-weight:600;}
  .log-item .acts{display:flex;gap:6px;align-items:flex-start;}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .tag{font-size:11px;background:var(--surface-2);border:1px solid var(--rule);color:var(--muted);padding:2px 9px;border-radius:100px;}
  .tag.silver{border-color:rgba(169,180,191,.35);color:#A9B4BF;}
  .tag.gold{border-color:rgba(226,53,47,.35);color:var(--accent);}
  .tag.platinum{border-color:rgba(37,99,235,.35);color:var(--info);}
  .tag.walkin{border-color:var(--rule-2);color:var(--muted);}
  .tag.cust{border-color:rgba(37,99,235,.30);color:var(--info);}
  .empty{color:var(--muted);font-size:13px;padding:30px 0;text-align:center;line-height:1.7;}
  .empty b{color:var(--ink);display:block;margin-bottom:5px;font-size:13.5px;}

  /* tables */
  .scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;
    color:var(--faint);font-weight:600;padding:0 14px 9px 0;
    border-bottom:1px solid var(--rule-2);white-space:nowrap;
  }
  td{padding:10px 14px 10px 0;border-bottom:1px solid var(--rule);white-space:nowrap;color:var(--ink-2);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover td{background:rgba(226,53,47,.04);}
  tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--accent);}
  td.n{color:var(--accent);font-family:'Inter',system-ui,sans-serif;font-weight:600;text-align:right;}
  td.r{text-align:right;color:var(--muted);}
  td.rt{text-align:right;color:var(--ink);}
  th.r{text-align:right;}

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
/* ============================================================================
   Launch War Room — Token Pattern & Countdown Tracker
   Backend: Google Apps Script web app over Google Sheets
   ========================================================================== */

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySTP4F2NBviqwWjx7Uq4BLS24edcWUpUf8503CKBfyG0nBBGk0pmibhzrVztubt9uv/exec';

const UNIT_TYPES = ['2BHK','2.5BHK','3BHK','3.5BHK','4BHK'];
const CHANNELS   = ['CP','Direct Walk-in','Referral','Digital','Hoarding'];
const TOKEN_TYPES = [
  { name:'Silver',   key:'silver',   amount:50000,  refundable:true,  terms:'No flat allotted. Launch rate held. Fully refundable if they walk away.' },
  { name:'Gold',     key:'gold',     amount:100000, refundable:true,  terms:'Flat selection at the launch-day offer. Still 100% refundable.' },
  { name:'Platinum', key:'platinum', amount:200000, refundable:false, terms:'Extra ₹1L off on launch day, flat selection at launch rate. Non-refundable.' }
];
const WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

const DEFAULT_SLABS = { Silver:50000, Gold:100000, Platinum:200000 };
function slabAmount(project, slabName){
  const key = canonical(TOKEN_TYPES.map(t => t.name), slabName);
  const v = project && project.tokenSlabs ? num(project.tokenSlabs[key]) : 0;
  return v || num(DEFAULT_SLABS[key]);
}

const DEFAULT_PRICES = { '2BHK':6500000, '2.5BHK':7800000, '3BHK':9500000, '3.5BHK':11500000, '4BHK':15000000 };
const DEFAULT_ASSUMPTIONS = { tokenToBooking: 65 };
const STD_TOKEN_INCENTIVE   = 1000;
const STD_BOOKING_INCENTIVE = 5000;

function tokenTypeInfo(name){
  const hit = TOKEN_TYPES.find(t => t.name === name);
  if(hit) return hit;
  const k = canonKey(name);
  return TOKEN_TYPES.find(t => canonKey(t.name) === k) || TOKEN_TYPES[0];
}

function canonKey(s){ return String(s==null?'':s).toLowerCase().replace(/[\s_\-.]/g,''); }
function canonical(list, raw){
  const v = String(raw==null?'':raw).trim();
  if(!v) return v;
  const k = canonKey(v);
  return list.find(x => canonKey(x) === k)
      || list.find(x => canonKey(x) === k.replace(/s$/,''))
      || list.find(x => canonKey(x)+'s' === k)
      || v;
}

let state = { projects: [], entries: [], team: [], customerAttended: [], activeProjectId: null };
let view = 'command';
let modal = null;
let loading = true, saving = false, loadError = null, pageError = null;
let charts = {};
let tickHandle = null;

function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function dObj(iso){ return new Date(iso + 'T00:00:00'); }
function fmtDate(iso){ if(!iso) return '—'; return dObj(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }
function fmtDay(iso){ if(!iso) return ''; return WEEKDAYS[dObj(iso).getDay()].slice(0,3); }
function daysBetween(a,b){ return Math.round((dObj(b) - dObj(a)) / 86400000); }
function addDays(iso,n){ const d = dObj(iso); d.setDate(d.getDate()+n); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function num(v){ const n = Number(v); return isFinite(n) ? n : 0; }
function fmtINR(n){ return '₹' + Math.round(num(n)).toLocaleString('en-IN'); }
function fmtMoney(n){
  n = num(n);
  if(Math.abs(n) >= 10000000) return '₹' + (n/10000000).toFixed(2) + ' Cr';
  if(Math.abs(n) >= 100000)   return '₹' + (n/100000).toFixed(1) + ' L';
  return fmtINR(n);
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function pctOf(a,b){ return b > 0 ? (a/b*100) : 0; }
function defaultChannelTargets(){ return CHANNELS.map(ch => ({ channel: ch, targetWalkins: 0, targetTokens: 0 })); }
function safeJSON(s, fallback){ try { const v = typeof s === 'string' ? JSON.parse(s) : s; return v && typeof v === 'object' ? v : fallback; } catch(e){ return fallback; } }

async function fetchWithRetry(url, opts, attempts = 3, delayMs = 900){
  let lastErr, lastRes;
  for(let i = 0; i < attempts; i++){
    try {
      const res = await fetch(url, opts);
      if(res.ok) return res;
      lastRes = res;
      lastErr = new Error('HTTP ' + res.status);
    } catch(err){ lastErr = err; }
    if(i < attempts-1) await new Promise(r => setTimeout(r, delayMs*(i+1)));
  }
  if(lastRes) return lastRes;
  throw new Error(`Network request failed after ${attempts} attempts: ${lastErr.message || lastErr}`);
}
async function apiGet(){
  const res = await fetchWithRetry(APPS_SCRIPT_URL, { method:'GET' });
  if(!res.ok) throw new Error('GET failed: ' + res.status);
  return res.json();
}
async function apiPost(payload){
  const res = await fetchWithRetry(APPS_SCRIPT_URL, {
    method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('POST failed: ' + res.status);
  const data = await res.json();
  if(data && data.ok === false) throw new Error(data.error || 'Request failed');
  return data;
}

async function loadState(){
  loading = true; loadError = null; render();
  try{
    const data = await apiGet();

    state.projects = (data.projects || []).map(p => {
      const wByCh = p.targetWalkinsByChannel || {};
      const tByCh = p.targetTokensByChannel || {};
      const channelTargets = CHANNELS.map(ch => ({
        channel: ch, targetWalkins: num(wByCh[ch]), targetTokens: num(tByCh[ch])
      }));
      const unitPrices = Object.assign({}, DEFAULT_PRICES, safeJSON(p.unitPrices, {}));
      const assumptions = Object.assign({}, DEFAULT_ASSUMPTIONS, safeJSON(p.assumptions, {}));
      const tokenSlabs  = Object.assign({}, DEFAULT_SLABS, safeJSON(p.tokenSlabs, {}));
      return {
        id:p.id, name:p.name, launchDate:p.launchDate, targetDate:p.targetDate,
        channelTargets, unitPrices, assumptions, tokenSlabs,
        targetWalkins: channelTargets.reduce((s,c)=>s+c.targetWalkins,0),
        targetTokens:  channelTargets.reduce((s,c)=>s+c.targetTokens,0)
      };
    });

    const projById = {}; state.projects.forEach(p => projById[p.id] = p);
    state.entries = (data.entries || []).map(e => {
      const proj = projById[e.projectId];
      const walkinRows = (e.walkins || []).map(w => ({ channel:canonical(CHANNELS, w.channel), count:num(w.count) }));
      return {
        id:e.id, projectId:e.projectId, date:e.date,
        walkinRows,
        walkins: walkinRows.reduce((s,w)=>s+w.count,0),
        tokens: (e.tokens || []).map(t => ({
          ...t,
          unitType:  canonical(UNIT_TYPES, t.unitType),
          channel:   canonical(CHANNELS, t.channel),
          tokenType: canonical(TOKEN_TYPES.map(x => x.name), t.tokenType),
          salesExecutive: String(t.salesExecutive==null?'':t.salesExecutive).trim(),
          count: num(t.count),
          amount: slabAmount(proj, t.tokenType)
        })),
        attendance: (e.attendance || []).map(a => ({ salesExecutive:String(a.salesExecutive==null?'':a.salesExecutive).trim(), customersAttended:num(a.customersAttended) })),
        upgrades: (e.upgrades || []).map(u => {
          const from = canonical(TOKEN_TYPES.map(x => x.name), u.fromSlab);
          const to   = canonical(TOKEN_TYPES.map(x => x.name), u.toSlab);
          const fromAmt = slabAmount(proj, from), toAmt = slabAmount(proj, to);
          return { fromSlab:from, toSlab:to,
                   salesExecutive:String(u.salesExecutive==null?'':u.salesExecutive).trim(),
                   count:num(u.count), fromAmount:fromAmt, toAmount:toAmt,
                   delta:(toAmt - fromAmt) * num(u.count) };
        })
      };
    });

    state.team = (data.team || []).map(t => ({
      id:t.id, name:t.name, salary:num(t.salary),
      incentivePerToken:num(t.incentivePerToken),
      incentivePerBooking:num(t.incentivePerBooking)
    }));

    state.customerAttended = [];
    state.entries.forEach(e => (e.attendance || []).forEach(a => {
      if(!a.salesExecutive) return;
      state.customerAttended.push({ projectId:e.projectId, date:e.date, teamMemberName:a.salesExecutive, count:num(a.customersAttended) });
    }));

    if(!state.activeProjectId || !state.projects.find(p => p.id === state.activeProjectId)){
      state.activeProjectId = state.projects[0] ? state.projects[0].id : null;
    }
  }catch(e){
    loadError = e.message || String(e);
  }
  loading = false; render();
}

async function withSaving(fn){
  saving = true; render();
  try{ await fn(); }
  catch(e){
    saving = false;
    const again = confirm(`The sheet didn't accept that after 3 tries.\n\n${e.message||e}\n\nNothing was lost — your entry is still on screen. Try again now?`);
    if(again) return withSaving(fn);
  }
  saving = false; render();
}

function activeProject(){ return state.projects.find(p => p.id === state.activeProjectId) || null; }
function entriesFor(pid){ return state.entries.filter(e => e.projectId === pid).sort((a,b) => a.date.localeCompare(b.date)); }
function rosterNames(){ return state.team.map(m => m.name).sort((a,b) => a.localeCompare(b)); }

function computeMetrics(project){
  const entries = entriesFor(project.id);
  const today = todayISO();

  const totalWalkins = entries.reduce((s,e) => s + e.walkins, 0);
  const totalTokens  = entries.reduce((s,e) => s + e.tokens.reduce((ss,t) => ss + t.count, 0), 0);

  const ledger = {};
  TOKEN_TYPES.forEach(t => ledger[t.name] = { issued:0, out:0, in:0 });
  entries.forEach(e => {
    e.tokens.forEach(t => { if(ledger[t.tokenType]) ledger[t.tokenType].issued += t.count; });
    (e.upgrades||[]).forEach(u => {
      if(ledger[u.fromSlab]) ledger[u.fromSlab].out += u.count;
      if(ledger[u.toSlab])   ledger[u.toSlab].in   += u.count;
    });
  });
  TOKEN_TYPES.forEach(t => {
    const L = ledger[t.name];
    L.net = L.issued - L.out + L.in;
    L.amount = slabAmount(project, t.name);
    L.value = L.net * L.amount;
    L.refundable = t.refundable;
  });

  let totalValue = 0, secured = 0, atRisk = 0;
  TOKEN_TYPES.forEach(t => {
    const L = ledger[t.name];
    totalValue += L.value;
    if(L.refundable) atRisk += L.value; else secured += L.value;
  });

  const issuedValue = entries.reduce((s,e) => s + e.tokens.reduce((ss,t)=>ss+t.count*t.amount,0), 0);
  const upgradeCount = entries.reduce((s,e) => s + (e.upgrades||[]).reduce((ss,u)=>ss+u.count,0), 0);
  const upgradeValue = entries.reduce((s,e) => s + (e.upgrades||[]).reduce((ss,u)=>ss+u.delta,0), 0);
  const topSlab = TOKEN_TYPES.filter(t => !t.refundable).slice(-1)[0] || TOKEN_TYPES[TOKEN_TYPES.length-1];
  const topAmount = slabAmount(project, topSlab.name);
  const upgradeUpside = TOKEN_TYPES.filter(t => t.refundable)
    .reduce((s,t) => s + ledger[t.name].net * Math.max(0, topAmount - ledger[t.name].amount), 0);
  const refundableTokens = TOKEN_TYPES.filter(t => t.refundable).reduce((s,t)=>s+ledger[t.name].net,0);
  const upgradeRate = pctOf(upgradeCount, upgradeCount + refundableTokens);

  const daysTotal     = Math.max(1, daysBetween(project.launchDate, project.targetDate) + 1);
  const rawRemaining  = daysBetween(today, project.targetDate) + 1;
  const daysRemaining = clamp(rawRemaining, 0, daysTotal);
  const windowClosed  = rawRemaining <= 0;
  const notStarted    = daysBetween(today, project.launchDate) > 0;
  const daysElapsed   = clamp(daysTotal - daysRemaining, 0, daysTotal);

  const loggedDays = entries.length;
  const rateBase   = Math.max(1, daysElapsed || loggedDays);
  const runTokens  = totalTokens / rateBase;
  const runWalkins = totalWalkins / rateBase;

  const walkinsLeft = Math.max(0, project.targetWalkins - totalWalkins);
  const tokensLeft  = Math.max(0, project.targetTokens  - totalTokens);
  const reqTokens   = daysRemaining > 0 ? tokensLeft  / daysRemaining : tokensLeft;
  const reqWalkins  = daysRemaining > 0 ? walkinsLeft / daysRemaining : walkinsLeft;

  const projectedTokens  = Math.round(totalTokens  + runTokens  * daysRemaining);
  const projectedWalkins = Math.round(totalWalkins + runWalkins * daysRemaining);
  const gapAtTarget      = projectedTokens - project.targetTokens;

  const expectedPct = daysTotal > 0 ? daysElapsed / daysTotal : 0;
  const achievedPct = project.targetTokens > 0 ? totalTokens / project.targetTokens : 0;
  const paceIndex   = expectedPct > 0 ? achievedPct / expectedPct : (achievedPct > 0 ? 2 : 1);

  const inWindow = (from,to) => entries.filter(e => e.date >= from && e.date <= to);
  const w1 = inWindow(addDays(today,-6), today);
  const w0 = inWindow(addDays(today,-13), addDays(today,-7));
  const sum = (arr,f) => arr.reduce((s,e) => s + f(e), 0);
  const tok = e => e.tokens.reduce((s,t) => s + t.count, 0);
  const last7Tokens = sum(w1,tok), prev7Tokens = sum(w0,tok);
  const last7Walkins = sum(w1, e => e.walkins), prev7Walkins = sum(w0, e => e.walkins);
  const a1 = w1.length ? last7Tokens/w1.length : 0, a0 = w0.length ? prev7Tokens/w0.length : 0;
  const momentum = a0 > 0 ? ((a1 - a0)/a0*100) : (a1 > 0 ? 100 : 0);
  const momentumValid = w0.length >= 2 && w1.length >= 2;

  const conversion = pctOf(totalTokens, totalWalkins);
  const last7Conv  = pctOf(last7Tokens, last7Walkins);

  const unitMix = {};
  entries.forEach(e => e.tokens.forEach(t => { unitMix[t.unitType] = (unitMix[t.unitType]||0) + t.count; }));
  const convRate = clamp(num(project.assumptions.tokenToBooking), 0, 100) / 100;
  let bookedValue = 0;
  Object.keys(unitMix).forEach(u => { bookedValue += unitMix[u] * convRate * num(project.unitPrices[u]); });
  const avgTicket = totalTokens > 0
    ? Object.keys(unitMix).reduce((s,u) => s + unitMix[u]*num(project.unitPrices[u]), 0) / totalTokens
    : 0;
  const projectedRevenue = projectedTokens * convRate * avgTicket;
  const targetRevenue    = project.targetTokens * convRate * avgTicket;

  const todayEntry = entries.find(e => e.date === today) || null;

  return { entries, today, totalWalkins, totalTokens, totalValue, secured, atRisk,
    ledger, issuedValue, upgradeCount, upgradeValue, upgradeUpside, upgradeRate,
    refundableTokens, topSlabName: topSlab.name, topAmount,
    daysTotal, daysRemaining, daysElapsed, windowClosed, notStarted, loggedDays,
    runTokens, runWalkins, walkinsLeft, tokensLeft, reqTokens, reqWalkins,
    projectedTokens, projectedWalkins, gapAtTarget, paceIndex, expectedPct, achievedPct,
    last7Tokens, prev7Tokens, last7Walkins, prev7Walkins, momentum, momentumValid, conversion, last7Conv,
    unitMix, avgTicket, bookedValue, projectedRevenue, targetRevenue, convRate, todayEntry };
}

function channelStats(project, entries){
  const aw = {}, at = {}, av = {};
  entries.forEach(e => {
    (e.walkinRows||[]).forEach(w => { aw[w.channel] = (aw[w.channel]||0) + w.count; });
    e.tokens.forEach(t => {
      at[t.channel] = (at[t.channel]||0) + t.count;
      av[t.channel] = (av[t.channel]||0) + t.count * t.amount;
    });
  });
  const tg = {}; (project.channelTargets||[]).forEach(c => tg[c.channel] = c);
  const totalTokens = Object.values(at).reduce((s,v) => s+v, 0);
  return CHANNELS.map(ch => {
    const targetWalkins = tg[ch] ? tg[ch].targetWalkins : 0;
    const targetTokens  = tg[ch] ? tg[ch].targetTokens  : 0;
    const achievedWalkins = aw[ch]||0, achievedTokens = at[ch]||0;
    return {
      channel: ch, targetWalkins, achievedWalkins, targetTokens, achievedTokens,
      value: av[ch]||0,
      conversion: pctOf(achievedTokens, achievedWalkins),
      walkinPct: pctOf(achievedWalkins, targetWalkins),
      tokenPct:  pctOf(achievedTokens,  targetTokens),
      share:     pctOf(achievedTokens,  totalTokens),
      gap: targetTokens - achievedTokens
    };
  });
}

function weekdayStats(entries){
  const rows = WEEKDAYS.map(w => ({ label:w, days:0, walkins:0, tokens:0 }));
  entries.forEach(e => {
    const r = rows[dObj(e.date).getDay()];
    r.days++; r.walkins += e.walkins; r.tokens += e.tokens.reduce((s,t)=>s+t.count,0);
  });
  return rows.map(r => ({ ...r,
    avgWalkins: r.days ? r.walkins/r.days : 0,
    avgTokens:  r.days ? r.tokens/r.days  : 0,
    conversion: pctOf(r.tokens, r.walkins)
  }));
}

function unitStats(project, entries){
  const map = {};
  entries.forEach(e => e.tokens.forEach(t => {
    if(!map[t.unitType]) map[t.unitType] = { unitType:t.unitType, tokens:0, tokenValue:0 };
    map[t.unitType].tokens += t.count;
    map[t.unitType].tokenValue += t.count * t.amount;
  }));
  const total = Object.values(map).reduce((s,r)=>s+r.tokens,0);
  return Object.values(map).map(r => ({ ...r,
    price: num(project.unitPrices[r.unitType]),
    share: pctOf(r.tokens, total),
    pipeline: r.tokens * num(project.unitPrices[r.unitType])
  })).sort((a,b) => b.tokens - a.tokens);
}

function typeStats(m){
  return TOKEN_TYPES.map(t => {
    const L = m.ledger[t.name];
    return { name:t.name, key:t.key, refundable:t.refundable,
             issued:L.issued, out:L.out, in:L.in, count:L.net, amount:L.amount, value:L.value };
  });
}

function teamPerformance(entries, projectId, convRate){
  const map = {};
  const seed = n => { if(!map[n]) map[n] = { name:n, tokens:0, value:0, silver:0, gold:0, platinum:0, dates:new Set(), customers:0, upgrades:0, upgradeValue:0 }; return map[n]; };
  entries.forEach(e => e.tokens.forEach(t => {
    const r = seed((t.salesExecutive || 'Unassigned').trim() || 'Unassigned');
    r.tokens += t.count;
    r.value  += t.count * t.amount;
    r.dates.add(e.date);
    r[tokenTypeInfo(t.tokenType).key] += t.count;
  }));
  entries.forEach(e => (e.upgrades||[]).forEach(u => {
    const r = seed((u.salesExecutive || 'Unassigned').trim() || 'Unassigned');
    r.upgrades += u.count;
    r.upgradeValue += u.delta;
    r.dates.add(e.date);
  }));
  state.customerAttended.filter(c => c.projectId === projectId).forEach(c => {
    const r = seed(c.teamMemberName); r.customers += c.count; r.dates.add(c.date);
  });
  const totalTokens = Object.values(map).reduce((s,r)=>s+r.tokens,0);
  return Object.values(map).map(r => {
    const roster = state.team.find(m => m.name === r.name);
    const ipt = roster ? roster.incentivePerToken : 0;
    const ipb = roster ? roster.incentivePerBooking : 0;
    const projBookings = r.tokens * num(convRate);
    const tokenPay = ipt * r.tokens;
    const bookingPay = projBookings * ipb;
    return { ...r,
      activeDays: r.dates.size,
      tokensPerDay: r.dates.size ? r.tokens/r.dates.size : 0,
      valuePerToken: r.tokens ? r.value/r.tokens : 0,
      share: pctOf(r.tokens, totalTokens),
      conversion: r.customers ? pctOf(r.tokens, r.customers) : null,
      incentiveCost: tokenPay,
      bookingIncentive: bookingPay,
      projBookings,
      totalIncentive: tokenPay + bookingPay,
      ratesSet: !!roster && (ipt > 0 || ipb > 0),
      salary: roster ? roster.salary : null,
      onRoster: !!roster
    };
  }).sort((a,b) => b.tokens - a.tokens);
}

function dataQuality(project, m){
  const flags = [];
  const { entries, today } = m;
  const start = project.launchDate, end = today < project.targetDate ? today : project.targetDate;
  if(daysBetween(start, end) >= 0){
    const have = new Set(entries.map(e => e.date));
    const missing = [];
    for(let d = start; daysBetween(d, end) >= 0; d = addDays(d,1)) if(!have.has(d)) missing.push(d);
    if(missing.length) flags.push({ kind:'data', title:`${missing.length} day${missing.length===1?'':'s'} never logged`,
      text:`No entry exists for ${missing.slice(-4).map(fmtDate).join(', ')}${missing.length>4?' and '+(missing.length-4)+' more':''}. Run rates and averages read low until those days are filled or confirmed as zero.` });
  }
  let mismatch = 0;
  entries.forEach(e => {
    const att = (e.attendance||[]).reduce((s,a) => s + a.customersAttended, 0);
    if(e.walkins > 0 && att > 0 && Math.abs(att - e.walkins) / e.walkins > 0.15) mismatch++;
  });
  if(mismatch) flags.push({ kind:'data', title:`Attendance doesn't reconcile on ${mismatch} day${mismatch===1?'':'s'}`,
    text:'Customers attended by the team differs from walk-ins logged by more than 15%. Either people are being missed at the desk, or the same customer is being counted by two executives.' });
  const unattributed = entries.reduce((s,e) => s + e.tokens.filter(t => !t.salesExecutive).reduce((ss,t)=>ss+t.count,0), 0);
  if(unattributed) flags.push({ kind:'data', title:`${unattributed} token${unattributed===1?'':'s'} with no executive named`,
    text:'These drop out of the leaderboard and out of incentive costing. Edit those days and attribute them.' });
  const ch = channelStats(project, entries);
  const bad = ch.filter(c => c.achievedTokens > c.achievedWalkins && c.achievedTokens > 0);
  if(bad.length) flags.push({ kind:'data', title:`More tokens than walk-ins on ${bad.map(b=>b.channel).join(', ')}`,
    text:'A token was logged against a channel with fewer walk-ins recorded. Usually the walk-in was tagged to the wrong source.' });
  if(project.targetTokens === 0) flags.push({ kind:'risk', title:'No token target set for this launch',
    text:'Countdown, pace and projection are all measured against zero. Open Launch settings and set per-channel targets.' });
  return flags;
}

function buildInsights(project, m, ch, wd, units, team){
  const out = [];
  const T = project.targetTokens;

  if(T > 0 && !m.windowClosed){
    if(m.gapAtTarget < 0){
      out.push({ kind:'risk', title:`On today's run rate you land ${Math.abs(m.gapAtTarget)} tokens short`,
        text:`You are converting <b>${m.runTokens.toFixed(1)} tokens a day</b> and need <b>${m.reqTokens.toFixed(1)}</b> for the remaining ${m.daysRemaining} day${m.daysRemaining===1?'':'s'}. That is a ${(m.reqTokens/Math.max(0.1,m.runTokens)).toFixed(1)}× lift, not a nudge.` });
    } else {
      out.push({ kind:'win', title:`Current pace clears the target by ${m.gapAtTarget} tokens`,
        text:`Holding <b>${m.runTokens.toFixed(1)} a day</b> for ${m.daysRemaining} more day${m.daysRemaining===1?'':'s'} lands you at ${m.projectedTokens} against a target of ${T}.` });
    }
  }

  if(m.totalWalkins > 0){
    const needWalkins = m.conversion > 0 ? Math.round(m.reqTokens / (m.conversion/100)) : 0;
    out.push({ kind:'watch', title:`Hitting pace needs ${needWalkins} walk-ins a day at today's conversion`,
      text:`You are closing <b>${m.conversion.toFixed(1)}%</b> of walk-ins. Push conversion to ${(m.conversion*1.25).toFixed(1)}% and the same target needs only ${Math.round(needWalkins/1.25)} walk-ins a day — cheaper than buying more footfall.` });
  }

  const live = ch.filter(c => c.achievedWalkins >= 5);
  if(live.length >= 2){
    const best = live.slice().sort((a,b) => b.conversion - a.conversion)[0];
    const worst = live.slice().sort((a,b) => a.conversion - b.conversion)[0];
    if(worst.conversion === 0){
      out.push({ kind:'risk', title:`${worst.channel} has produced ${worst.achievedWalkins} walk-ins and zero tokens`,
        text:`Meanwhile ${best.channel} converts <b>${best.conversion.toFixed(1)}%</b>. Either the ${worst.channel} lead quality is wrong or nobody is being sat down properly. Listen to one ${worst.channel} pitch today before spending another rupee there.` });
    } else if(best.conversion > worst.conversion * 1.3){
      out.push({ kind:'win', title:`${best.channel} converts ${best.conversion.toFixed(1)}%, ${worst.channel} only ${worst.conversion.toFixed(1)}%`,
        text:`${best.channel} turns ${Math.round(100/best.conversion)} walk-ins into a token; ${worst.channel} needs ${Math.round(100/worst.conversion)}. Shift spend and your strongest closers toward ${best.channel}.` });
    }
  }
  const behind = ch.filter(c => c.targetTokens > 0 && c.tokenPct < 60).sort((a,b) => a.tokenPct - b.tokenPct)[0];
  if(behind) out.push({ kind:'risk', title:`${behind.channel} is at ${Math.round(behind.tokenPct)}% of its token target`,
    text:`${behind.achievedTokens} of ${behind.targetTokens} tokens, leaving a gap of ${behind.gap}. This is the single biggest channel shortfall on the board.` });

  if(m.refundableTokens > 0 && m.upgradeUpside > 0){
    out.push({ kind:'watch', title:`${m.refundableTokens} tokens could still move up to ${m.topSlabName}`,
      text:`That is <b>${fmtMoney(m.upgradeUpside)}</b> of top-up money from customers who have already said yes once, and it converts refundable cash into locked cash. ${m.upgradeCount ? `${m.upgradeCount} have moved so far, an upgrade rate of ${m.upgradeRate.toFixed(0)}%.` : 'Nothing has been upgraded yet.'}` });
  }

  if(m.totalValue > 0){
    const riskPct = pctOf(m.atRisk, m.totalValue);
    if(riskPct > 60) out.push({ kind:'risk', title:`${Math.round(riskPct)}% of collected token money is refundable`,
      text:`<b>${fmtMoney(m.atRisk)}</b> sits in Silver and Gold, which can walk out of the door. Only ${fmtMoney(m.secured)} in Platinum is locked. Give the sales floor a reason to upgrade tokens before launch day.` });
  }

  const wdLive = wd.filter(r => r.days >= 2);
  if(wdLive.length >= 3){
    const b = wdLive.slice().sort((a,b) => b.avgTokens - a.avgTokens)[0];
    const w = wdLive.slice().sort((a,b) => a.avgTokens - b.avgTokens)[0];
    if(b.avgTokens > w.avgTokens * 1.4) out.push({ kind:'watch', title:`${b.label} does ${(b.avgTokens/Math.max(0.1,w.avgTokens)).toFixed(1)}× the tokens of ${w.label}`,
      text:`${b.label} averages <b>${b.avgTokens.toFixed(1)} tokens</b> against ${w.avgTokens.toFixed(1)} on ${w.label}. Put your full bench and the site visits on ${b.label}, and use ${w.label} for CP calling and follow-ups.` });
  }

  if(m.momentumValid){
    if(m.momentum <= -20) out.push({ kind:'risk', title:`Last 7 days are down ${Math.abs(m.momentum).toFixed(0)}% on the week before`,
      text:`${m.last7Tokens} tokens in the last 7 days against ${m.prev7Tokens} the week before. Momentum is going the wrong way with ${m.daysRemaining} day${m.daysRemaining===1?'':'s'} left.` });
    else if(m.momentum >= 20) out.push({ kind:'win', title:`Last 7 days are up ${m.momentum.toFixed(0)}% on the week before`,
      text:`${m.last7Tokens} tokens this week against ${m.prev7Tokens} the week before. Whatever changed last week, hold it.` });
  }

  if(team.length >= 3){
    const top = team[0], top2 = team.slice(0,2).reduce((s,t)=>s+t.tokens,0);
    const conc = pctOf(top2, m.totalTokens);
    if(conc > 60) out.push({ kind:'risk', title:`${Math.round(conc)}% of tokens come from two executives`,
      text:`${escapeHtml(top.name)} alone has ${top.tokens}. If either is off on launch day the number collapses. Pair the weaker half of the bench with them this week.` });
    const idle = team.filter(t => t.customers >= 10 && t.tokens === 0);
    if(idle.length) out.push({ kind:'watch', title:`${idle.length} executive${idle.length===1?'':'s'} attended customers but closed nothing`,
      text:`${idle.map(t=>escapeHtml(t.name)).join(', ')} handled walk-ins without a single token. Sit in on their next pitch before adding more leads to their queue.` });
  }

  if(units.length >= 2 && m.totalTokens >= 10){
    const top = units[0];
    if(top.share > 45) out.push({ kind:'watch', title:`${top.unitType} is ${Math.round(top.share)}% of all demand`,
      text:`${top.tokens} of ${m.totalTokens} tokens are on ${top.unitType} at ${fmtMoney(top.price)}. Check the release plan holds enough ${top.unitType} inventory, or you will be turning buyers away on launch day.` });
  }

  return out;
}

function launchHealth(project, m, ch){
  const comp = [];
  const push = (name, score, note) => comp.push({ name, score: clamp(Math.round(score), 0, 100), note });

  push('Target pacing', project.targetTokens ? m.paceIndex * 100 : 0,
       `${Math.round(m.achievedPct*100)}% of target with ${Math.round(m.expectedPct*100)}% of the window gone`);

  const walkPace = (project.targetWalkins > 0 && m.expectedPct > 0)
    ? (m.totalWalkins / project.targetWalkins) / m.expectedPct * 100 : 0;
  push('Footfall pacing', walkPace, `${m.totalWalkins} of ${project.targetWalkins} walk-ins`);

  push('Conversion quality', m.conversion / 10 * 100, `${m.conversion.toFixed(1)}% against a 10% floor`);

  const shares = ch.filter(c => c.achievedTokens > 0).map(c => c.share/100);
  let div = 0;
  if(shares.length){
    const hhi = shares.reduce((s,v) => s + v*v, 0);
    const n = CHANNELS.length;
    div = (1 - (hhi - 1/n) / (1 - 1/n)) * 100;
  }
  push('Source spread', div, `${shares.length} of ${CHANNELS.length} channels producing tokens`);

  push('Commitment quality', pctOf(m.secured, m.totalValue),
       `${fmtMoney(m.secured)} non-refundable of ${fmtMoney(m.totalValue)}`);

  push('Logging discipline', m.daysElapsed ? m.loggedDays / m.daysElapsed * 100 : 100,
       `${m.loggedDays} of ${m.daysElapsed} elapsed days logged`);

  const weights = [30, 15, 20, 10, 15, 10];
  const total = comp.reduce((s,c,i) => s + c.score * weights[i], 0) / weights.reduce((a,b)=>a+b,0);
  return { score: clamp(Math.round(total), 0, 100), components: comp };
}
function scoreClass(v){ return v >= 70 ? 's-good' : v >= 40 ? 's-mid' : 's-bad'; }

function sparkline(values, color){
  const W = 240, H = 46, pad = 4;
  const clean = values.filter(v => v !== null && isFinite(v));
  if(clean.length < 2) return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"></svg>`;
  const max = Math.max(...clean), min = Math.min(...clean);
  const span = (max - min) || 1;
  const x = i => (values.length === 1 ? 0 : (i / (values.length - 1)) * W);
  const y = v => H - pad - ((v - min) / span) * (H - pad*2);
  let dLine = '', dArea = '', open = false, firstX = 0, lastX = 0;
  values.forEach((v,i) => {
    if(v === null || !isFinite(v)){ open = false; return; }
    const px = x(i), py = y(v);
    if(!open){ dLine += `M${px.toFixed(1)},${py.toFixed(1)}`; if(!dArea) firstX = px; open = true; }
    else dLine += `L${px.toFixed(1)},${py.toFixed(1)}`;
    dArea += (dArea ? 'L' : `M${px.toFixed(1)},${H}L`) + `${px.toFixed(1)},${py.toFixed(1)}`;
    lastX = px;
  });
  const id = 'sg' + Math.random().toString(36).slice(2,8);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".34"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient>
      <filter id="${id}b" x="-20%" y="-60%" width="140%" height="220%">
        <feGaussianBlur stdDeviation="2.4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <path d="${dArea}L${lastX.toFixed(1)},${H}Z" fill="url(#${id})"/>
    <path d="${dLine}" fill="none" stroke="${color}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" filter="url(#${id}b)" opacity=".95"/>
  </svg>`;
}

function dailySeries(m, n){
  const out = { tokens:[], walkins:[], value:[], conv:[] };
  const entries = m.entries;
  if(!entries.length) return out;
  const end = m.today > entries[entries.length-1].date ? m.today : entries[entries.length-1].date;
  const start = addDays(end, -(n-1));
  const by = {}; entries.forEach(e => by[e.date] = e);
  let cum = 0;
  for(let d = start; daysBetween(d, end) >= 0; d = addDays(d,1)){
    const e = by[d];
    if(!e){ out.tokens.push(null); out.walkins.push(null); out.conv.push(null); out.value.push(cum); continue; }
    const t = e.tokens.reduce((s,x)=>s+x.count,0);
    cum += e.tokens.reduce((s,x)=>s+x.count*x.amount,0) + (e.upgrades||[]).reduce((s,u)=>s+u.delta,0);
    out.tokens.push(t); out.walkins.push(e.walkins);
    out.conv.push(e.walkins ? pctOf(t, e.walkins) : null);
    out.value.push(cum);
  }
  return out;
}

function destroyCharts(){ Object.values(charts).forEach(c => { try{ c.destroy(); }catch(e){} }); charts = {}; }
function stopClock(){ if(tickHandle){ clearInterval(tickHandle); tickHandle = null; } }
function safely(fn){ try{ fn(); }catch(err){ pageError = err && err.message ? err.message : String(err); console.error(err); } }

function render(){
  stopClock();
  try{ renderShell(); if(pageError) injectError(); }
  catch(err){ pageError = err && err.message ? err.message : String(err); console.error(err); try{ injectError(); }catch(e){} }
}

function injectError(){
  const b = document.getElementById('body'); if(!b || document.getElementById('errBox')) return;
  const d = document.createElement('div');
  d.id = 'errBox'; d.className = 'err';
  d.innerHTML = `<b>The page hit an error while drawing this view.</b> Everything already saved to the sheet is safe. Screenshot this box — it names the exact failure. <button class="link-btn" id="dismissErr" style="margin-left:6px;">Dismiss</button><span class="mono">${escapeHtml(pageError)}</span>`;
  b.prepend(d);
  document.getElementById('dismissErr').onclick = () => { pageError = null; render(); };
}

function renderShell(){
  let app = document.getElementById('app');
  if(!app){ app = document.createElement('div'); app.id = 'app'; document.body.appendChild(app); }
  destroyCharts();
  const proj = activeProject();

  const tabs = [['command','◉','Pulse'],['channels','⊕','Channels'],['pattern','≋','Pattern'],
                ['team','○','Team'],['roster','⊞','Roster']];
  app.innerHTML = `
    <div class="nav">
      <div class="brand"><h1>Launch Pulse</h1><span class="vtag">v2</span></div>
      <div class="navtabs" id="tabs">
        ${tabs.map(([k,g,l]) => `<button data-v="${k}" class="${view===k?'active':''}"><span class="g">${g}</span>${l}</button>`).join('')}
      </div>
      <div class="nav-sp"></div>
      <div class="status" id="sync"></div>
    </div>
    <div class="subnav"><span class="lbl">Launches</span><span id="picker" style="display:contents"></span></div>
    <div id="body"></div>
  `;

  const sync = document.getElementById('sync');
  const proj0 = activeProject();
  const tally = proj0 ? entriesFor(proj0.id) : [];
  const tTok = tally.reduce((s,e) => s + e.tokens.reduce((ss,t)=>ss+t.count,0), 0);
  if(loading)         sync.innerHTML = `<span class="dot" style="background:var(--muted-2)"></span>Reading the sheet…`;
  else if(saving)     sync.innerHTML = `<span class="dot" style="background:var(--amber)"></span>Saving…`;
  else if(loadError)  sync.innerHTML = `<span class="dot" style="background:var(--coral)"></span><span style="color:var(--coral)">Sheet unreachable — ${escapeHtml(loadError)}</span>`;
  else                sync.innerHTML = `<span class="dot pulse"></span>Live · ${tTok} tokens · ${tally.length} days`;

  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
  renderPicker();

  const body = document.getElementById('body');

  if(loading && state.projects.length === 0 && !loadError){
    body.innerHTML = `<div class="panel"><div class="empty">Loading your launches…</div></div>`;
    return syncModal();
  }
  if(view === 'roster'){ renderRoster(); return syncModal(); }
  if(!proj){
    body.innerHTML = `<div class="panel"><div class="empty"><b>No launch is being tracked yet.</b>Create one with its target date and per-channel walk-in and token targets, then log the first day.</div></div>`;
    return syncModal();
  }

  const m     = computeMetrics(proj);
  const ch    = channelStats(proj, m.entries);
  const wd    = weekdayStats(m.entries);
  const units = unitStats(proj, m.entries);
  const team  = teamPerformance(m.entries, proj.id, m.convRate);

  if(view === 'command')      renderCommand(proj, m, ch, wd, units, team);
  else if(view === 'channels') renderChannels(proj, m, ch, units);
  else if(view === 'pattern')  renderPattern(proj, m, wd);
  else if(view === 'team')     renderTeam(proj, m, team);

  syncModal();
}

function renderPicker(){
  const el = document.getElementById('picker'); el.innerHTML = '';
  state.projects.forEach(p => {
    const b = document.createElement('button');
    b.textContent = p.name;
    b.className = p.id === state.activeProjectId ? 'active' : '';
    b.onclick = () => { state.activeProjectId = p.id; render(); };
    el.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'add'; add.textContent = '+ New launch';
  add.onclick = () => {
    modal = { type:'project', data:{ id:null, name:'', launchDate:todayISO(), targetDate:addDays(todayISO(),30),
      channelTargets:defaultChannelTargets(), unitPrices:{...DEFAULT_PRICES}, assumptions:{...DEFAULT_ASSUMPTIONS} } };
    render();
  };
  el.appendChild(add);
}

function syncModal(){
  const ex = document.querySelector('.overlay'); if(ex) ex.remove();
  if(modal) renderModal();
}

function trend(v, goodUp = true){
  if(Math.abs(v) < 1) return `<span class="flat">flat</span>`;
  const up = v > 0, good = up === goodUp;
  return `<span class="${good?'up':'down'}">${up?'▲':'▼'} ${Math.abs(v).toFixed(0)}%</span>`;
}

function slimVerdict(project, m){
  const v = verdictParts(project, m);
  return `<div class="panel" style="margin-bottom:16px;padding:15px 18px;">
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
      <span class="pill ${v.cls==='good'?'good':v.cls==='bad'?'bad':'warn'}">${v.pill}</span>
      <div style="flex:1;min-width:240px;font-size:13.5px;line-height:1.55;color:var(--muted);"><b style="color:var(--text)">${v.head}</b> ${v.body}</div>
    </div></div>`;
}

function verdictParts(project, m){
  if(project.targetTokens === 0)
    return { cls:'warn', pill:'No target',
      head:'This launch has no token target yet.',
      body:'Everything on this board is measured against it. Open Launch settings and set per-channel walk-in and token targets.' };
  if(m.windowClosed){
    const hit = m.totalTokens >= project.targetTokens;
    return { cls: hit?'good':'bad', pill: hit?'Target met':'Window closed',
      head: hit ? `Closed at ${m.totalTokens} tokens against a target of ${project.targetTokens}.`
                : `Window closed ${project.targetTokens - m.totalTokens} tokens short of target.`,
      body: `${fmtMoney(m.totalValue)} collected across ${m.totalWalkins} walk-ins, a ${m.conversion.toFixed(1)}% conversion.` };
  }
  if(m.gapAtTarget >= 0)
    return { cls:'good', pill:'On pace',
      head:`On pace to land near ${m.projectedTokens} tokens, ${m.gapAtTarget} above target.`,
      body:`Running <b>${m.runTokens.toFixed(1)} tokens a day</b> against a required <b>${m.reqTokens.toFixed(1)}</b>, with ${m.daysRemaining} day${m.daysRemaining===1?'':'s'} left. Hold conversion at ${m.conversion.toFixed(1)}% and this stays comfortable.` };
  const severe = m.reqTokens > m.runTokens * 1.5;
  return { cls: severe?'bad':'warn', pill: severe?'Off pace':'Slipping',
    head:`Off pace — today's rate lands you near ${m.projectedTokens} tokens, ${Math.abs(m.gapAtTarget)} short.`,
    body:`You need <b>${m.reqTokens.toFixed(1)} tokens a day</b> for the next ${m.daysRemaining} day${m.daysRemaining===1?'':'s'} and are doing <b>${m.runTokens.toFixed(1)}</b>. At today's ${m.conversion.toFixed(1)}% conversion that means <b>${Math.round(m.conversion>0 ? m.reqTokens/(m.conversion/100) : 0)} walk-ins a day</b>.` };
}

function gaugeSvg(score){
  const R = 72, C = 2*Math.PI*R, on = C * clamp(score,0,100)/100;
  const col = score >= 70 ? 'var(--pos)' : score >= 40 ? 'var(--accent)' : 'var(--neg)';
  return `<svg width="172" height="172" viewBox="0 0 172 172">
    <circle cx="86" cy="86" r="${R}" fill="none" stroke="#E8EAED" stroke-width="10"/>
    <circle cx="86" cy="86" r="${R}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${on.toFixed(1)} ${(C-on).toFixed(1)}" transform="rotate(-90 86 86)"/>
  </svg>`;
}

function heroBlock(project, m, health){
  const v = verdictParts(project, m);
  const daysTxt = m.windowClosed ? 'window closed' : `${m.daysRemaining} day${m.daysRemaining===1?'':'s'} left`;
  const paceChip = project.targetTokens === 0 ? '' :
    (m.gapAtTarget >= 0 ? `<span class="chip good"><b>${m.runTokens.toFixed(1)}</b>/day, needs ${m.reqTokens.toFixed(1)}</span>`
                        : `<span class="chip bad"><b>${m.runTokens.toFixed(1)}</b>/day, needs ${m.reqTokens.toFixed(1)}</span>`);
  const untracked = m.daysElapsed - m.loggedDays;
  return `<div class="hero">
    <div>
      <div class="hero-num mono">${m.totalTokens}<span class="sub"> / ${project.targetTokens}</span><span class="u">tokens</span></div>
      <div class="chips">
        <span class="chip"><b>${fmtMoney(m.totalValue)}</b> collected</span>
        ${m.upgradeCount ? `<span class="chip good"><b>${m.upgradeCount}</b> upgraded, +${fmtMoney(m.upgradeValue)}</span>` : ''}
        <span class="chip"><b>${fmtMoney(m.bookedValue)}</b> booking pipeline</span>
        <span class="chip"><b>${m.totalWalkins}</b> walk-ins at ${m.conversion.toFixed(1)}%</span>
        <span class="chip hot"><b>${m.windowClosed ? '—' : m.daysRemaining}</b> ${daysTxt}</span>
        ${paceChip}
        ${untracked > 0 ? `<span class="chip bad"><b>${untracked}</b> days never logged</span>` : ''}
      </div>

    </div>
    <div class="gauge">

    </div>

      ${health.components.map(c => `<div class="score" title="${escapeHtml(c.note)}">

        <span class="n">${c.score}</span>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderCommand(proj, m, ch, wd, units, team){
  const body = document.getElementById('body');

function startClock(m){
  stopClock();
  const el = document.getElementById('clock'); if(!el) return;
  if(m.windowClosed){ el.textContent = 'Target date has passed'; return; }
  const tick = () => {
    const now = new Date();
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23,59,59);
    let d = Math.max(0, end - now);
    const h = Math.floor(d/3600000); d -= h*3600000;
    const mi = Math.floor(d/60000); d -= mi*60000;
    const s = Math.floor(d/1000);
    el.textContent = `${String(h).padStart(2,'0')}h ${String(mi).padStart(2,'0')}m ${String(s).padStart(2,'0')}s left today`;
  };
  tick(); tickHandle = setInterval(tick, 1000);
}

let draft = null;
function newDraft(){
  return {
    entryId: null, date: todayISO(),
    walkins: [{ channel:CHANNELS[0], count:0 }],
    customers: [{ teamMemberName:'', count:0 }],
    tokens: [{ unitType:UNIT_TYPES[0], channel:CHANNELS[0], tokenType:TOKEN_TYPES[0].name, salesExecutive:'', count:1 }],
    upgrades: []
  };
}
function ensureDraft(){ if(!draft) draft = newDraft(); return draft; }

function loadDayIntoDraft(entry, projectId){
  const cust = state.customerAttended.filter(c => c.projectId === projectId && c.date === entry.date)
    .map(c => ({ teamMemberName:c.teamMemberName, count:c.count }));
  draft = {
    entryId: entry.id, date: entry.date,
    walkins: entry.walkinRows.length ? entry.walkinRows.map(w => ({...w})) : [{ channel:CHANNELS[0], count:0 }],
    customers: cust.length ? cust : [{ teamMemberName:'', count:0 }],
    tokens: entry.tokens.length ? entry.tokens.map(t => ({...t})) : [{ unitType:UNIT_TYPES[0], channel:CHANNELS[0], tokenType:TOKEN_TYPES[0].name, salesExecutive:'', count:1 }],
    upgrades: (entry.upgrades || []).map(u => ({...u}))
  };
  render();
  const f = document.getElementById('entryForm');
  if(f && typeof f.scrollIntoView === 'function') f.scrollIntoView({ behavior:'smooth', block:'center' });
}

function execSelect(i, value, key, arrName){
  const names = rosterNames();
  const known = value === '' || names.includes(value);
  return `<select data-arr="${arrName}" data-i="${i}" data-k="${key}">
    <option value="" ${value===''?'selected':''}>Choose…</option>
    ${!known ? `<option value="${escapeHtml(value)}" selected>${escapeHtml(value)}</option>` : ''}
    ${names.map(n => `<option value="${escapeHtml(n)}" ${value===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}
    <option value="__new__">Add someone new…</option>
  </select>`;
}
function addExec(name){
  if(!name || state.team.some(m => m.name === name)) return;
  withSaving(async () => { await apiPost({ action:'saveTeamMember', member:{ name, salary:0, incentivePerToken:STD_TOKEN_INCENTIVE, incentivePerBooking:STD_BOOKING_INCENTIVE } }); await loadState(); });
}

function renderEntryForm(proj){
  const d = ensureDraft();
  const existing = entriesFor(proj.id).find(e => e.date === d.date);
  const el = document.getElementById('entryForm');
  el.innerHTML = `
    ${d.entryId ? `<div class="editing"><span>Editing <b>${fmtDate(d.date)}</b>. Saving overwrites that day.</span><button class="link-btn" id="cancelEdit">Start a fresh day</button></div>` : ''}
    ${!d.entryId && existing ? `<div class="editing"><span><b>${fmtDate(d.date)}</b> already has an entry. Saving will replace it.</span><button class="link-btn" id="loadExisting">Load it instead</button></div>` : ''}

    </div>

    <div class="rg">
      <div class="rg-title">Slab upgrades<span class="hint">${d.upgrades.length ? '+'+fmtINR(d.upgrades.reduce((s,u)=>s+(slabAmount(proj,u.toSlab)-slabAmount(proj,u.fromSlab))*num(u.count),0)) : 'none today'}</span></div>
      <div class="subs" id="uRows"></div>
      <button class="link-btn" id="addU" style="margin-top:8px;">Add an upgrade</button>
      <div style="font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.55;">
        Log an upgrade here, not as a new token. The token stays counted once and only the top-up is added to money collected.
      </div>
    </div>

    <button class="primary-btn" id="saveEntry" ${saving?'disabled':''}>${saving ? 'Saving…' : (d.entryId ? 'Save changes to '+fmtDate(d.date) : 'Save '+fmtDate(d.date))}</button>
  `;
  drawWalkinRows(); drawCustomerRows(); drawTokenRows(); drawUpgradeRows();

  document.getElementById('fDate').onchange = e => { d.date = e.target.value || todayISO(); d.entryId = null; renderEntryForm(proj); };
  const ce = document.getElementById('cancelEdit'); if(ce) ce.onclick = () => { draft = newDraft(); renderEntryForm(proj); };
  const le = document.getElementById('loadExisting'); if(le) le.onclick = () => loadDayIntoDraft(existing, proj.id);
  document.getElementById('addW').onclick = () => { d.walkins.push({ channel:CHANNELS[0], count:0 }); renderEntryForm(proj); };
  document.getElementById('addC').onclick = () => { d.customers.push({ teamMemberName:'', count:0 }); renderEntryForm(proj); };
  document.getElementById('addT').onclick = () => { d.tokens.push({ unitType:UNIT_TYPES[0], channel:CHANNELS[0], tokenType:TOKEN_TYPES[0].name, salesExecutive:'', count:1 }); renderEntryForm(proj); };
  document.getElementById('addU').onclick = () => { d.upgrades.push({ fromSlab:TOKEN_TYPES[0].name, toSlab:TOKEN_TYPES[1].name, salesExecutive:'', count:1 }); renderEntryForm(proj); };

  document.getElementById('saveEntry').onclick = () => {
    const date = d.date || todayISO();
    const walkins = d.walkins.map(r => ({ channel:r.channel, count:parseInt(r.count||0,10) })).filter(r => r.count > 0);
    const attendance = d.customers.map(r => ({ salesExecutive:r.teamMemberName, customersAttended:parseInt(r.count||0,10) }))
      .filter(r => r.salesExecutive && r.customersAttended > 0);
    const tokens = d.tokens.map(r => ({ ...r, count:parseInt(r.count||0,10) })).filter(r => r.count > 0);
    const upgrades = d.upgrades.map(r => ({ fromSlab:r.fromSlab, toSlab:r.toSlab,
      salesExecutive:r.salesExecutive || '', count:parseInt(r.count||0,10) })).filter(r => r.count > 0);
    const sameSlab = upgrades.find(u => u.fromSlab === u.toSlab);
    if(sameSlab){ alert(`An upgrade row moves from ${sameSlab.fromSlab} to ${sameSlab.fromSlab}, which changes nothing. Fix or remove it.`); return; }
    const downward = upgrades.find(u => slabAmount(proj, u.toSlab) < slabAmount(proj, u.fromSlab));
    if(downward && !confirm(`One row moves ${downward.fromSlab} down to ${downward.toSlab}, which subtracts money. Save it anyway?`)) return;
    if(!walkins.length && !tokens.length && !attendance.length && !upgrades.length){ alert('There is nothing to save on this day yet — add walk-ins, customers or tokens first.'); return; }
    withSaving(async () => {
      await apiPost({ action:'saveEntry', entry:{ projectId:proj.id, date, walkins, tokens, attendance, upgrades } });
      draft = newDraft();
      await loadState();
    });
  };
}

      <div class="field" style="max-width:78px;"><label>Count</label>

      <button class="icon-btn" data-del="tokens:${i}" title="Remove this row">×</button>`;
    wrap.appendChild(div);

function redraw(arr){
  if(arr === 'walkins') drawWalkinRows();
  else if(arr === 'customers') drawCustomerRows();
  else if(arr === 'upgrades') drawUpgradeRows();
  else drawTokenRows();
  updateTotal(arr);
}
function updateTotal(arr){
  const id = arr==='walkins' ? 'wRows' : arr==='customers' ? 'cRows' : 'tRows';
  const wrap = document.getElementById(id); if(!wrap) return;
  const total = draft[arr].reduce((s,r) => s + num(r.count), 0);
  const hint = wrap.parentElement.querySelector('.hint');
  if(hint) hint.textContent = 'total ' + total;
}
function defaultRow(arr){
  if(arr === 'upgrades') return { fromSlab:TOKEN_TYPES[0].name, toSlab:TOKEN_TYPES[1].name, salesExecutive:'', count:1 };
  if(arr === 'walkins') return { channel:CHANNELS[0], count:0 };
  if(arr === 'customers') return { teamMemberName:'', count:0 };
  return { unitType:UNIT_TYPES[0], channel:CHANNELS[0], tokenType:TOKEN_TYPES[0].name, salesExecutive:'', count:1 };
}
function wireRows(wrap){
  wrap.querySelectorAll('select,input').forEach(el => {
    const handler = e => {
      const arr = e.target.dataset.arr, i = +e.target.dataset.i, k = e.target.dataset.k;
      if((k === 'salesExecutive' || k === 'teamMemberName') && e.target.value === '__new__'){
        const name = (prompt('Name of the new team member:') || '').trim();
        if(name){ draft[arr][i][k] = name; addExec(name); }
        redraw(arr); return;
      }
      draft[arr][i][k] = e.target.value;
      if(k === 'count' && arr !== 'upgrades') updateTotal(arr); else redraw(arr);
    };
    el.onchange = handler;
  });
  wrap.querySelectorAll('[data-del]').forEach(b => b.onclick = e => {
    const [arr, idx] = e.target.dataset.del.split(':');
    draft[arr].splice(+idx, 1);
    if(!draft[arr].length && arr !== 'upgrades') draft[arr].push(defaultRow(arr));
    redraw(arr);
  });
}

function renderLog(entries, projectId){
  const el = document.getElementById('logList');
  if(!entries.length){ el.innerHTML = `<div class="empty"><b>Nothing logged yet.</b>Fill the form on the left and save your first day.</div>`; return; }
  el.innerHTML = entries.slice().reverse().map(e => {
    const t = e.tokens.reduce((s,x)=>s+x.count,0);
    const wTags = (e.walkinRows||[]).map(w => `<span class="tag walkin">${escapeHtml(w.channel)} ${w.count}</span>`).join('');
    const cTags = state.customerAttended.filter(c => c.projectId===projectId && c.date===e.date)
      .map(c => `<span class="tag cust">${escapeHtml(c.teamMemberName)} saw ${c.count}</span>`).join('');
    const uTags = (e.upgrades||[]).map(u => `<span class="tag platinum">${escapeHtml(u.fromSlab)} → ${escapeHtml(u.toSlab)} ×${u.count} (+${fmtINR(u.delta)})</span>`).join('');
    const tTags = e.tokens.map(x => `<span class="tag ${tokenTypeInfo(x.tokenType).key}">${escapeHtml(x.unitType)} ${escapeHtml(x.tokenType)}${x.salesExecutive?' · '+escapeHtml(x.salesExecutive):''} ×${x.count}</span>`).join('');
    return `<div class="log-item">
      <div class="d mono">${fmtDate(e.date)}<small>${fmtDay(e.date)}</small></div>
      <div class="st"><span class="n">${e.walkins}</span> walk-ins, <span class="n">${t}</span> token${t===1?'':'s'}${(e.upgrades||[]).length ? `, <span class="n">${(e.upgrades||[]).reduce((s,u)=>s+u.count,0)}</span> upgraded` : ''}
        ${e.walkins ? `<span style="color:var(--muted-2)"> · ${pctOf(t,e.walkins).toFixed(0)}%</span>` : ''}
        <div class="tags">${wTags}${cTags}${tTags}${uTags}</div></div>
      <div class="acts">
        <button class="link-btn" data-edit="${escapeHtml(e.id)}">Edit</button>
        <button class="icon-btn" data-drop="${escapeHtml(e.id)}" title="Delete this day" style="width:28px;height:28px;font-size:14px;">×</button>
      </div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = ev => {
    const e = entries.find(x => x.id === ev.target.dataset.edit);
    if(e) loadDayIntoDraft(e, projectId);
  });
  el.querySelectorAll('[data-drop]').forEach(b => b.onclick = ev => {
    const id = ev.target.dataset.drop;
    const e = entries.find(x => x.id === id);
    if(confirm(`Delete everything logged on ${e ? fmtDate(e.date) : 'this day'}?`)){
      withSaving(async () => { await apiPost({ action:'deleteEntry', entryId:id }); await loadState(); });
    }
  });
}

  const ctx = document.getElementById('cPace'); if(!ctx) return;
  const dates = [];
  for(let d = proj.launchDate; daysBetween(d, proj.targetDate) >= 0 && dates.length < 400; d = addDays(d,1)) dates.push(d);
  if(!dates.length) return;

  const byDate = {};
  m.entries.forEach(e => { byDate[e.date] = (byDate[e.date]||0) + e.tokens.reduce((s,t)=>s+t.count,0); });

  let run = 0;
  const actual = [], required = [], projection = [];
  const step = proj.targetTokens / Math.max(1, dates.length - 1);
  dates.forEach((d,i) => {
    required.push(Math.round(step*i));
    if(d <= m.today){ run += (byDate[d]||0); actual.push(run); projection.push(null); }
    else { actual.push(null); projection.push(null); }
  });
  const lastIdx = dates.findIndex(d => d === m.today);
  const anchor = lastIdx >= 0 ? lastIdx : actual.filter(v => v !== null).length - 1;
  if(anchor >= 0){
    projection[anchor] = actual[anchor];
    for(let i = anchor+1; i < dates.length; i++) projection[i] = Math.round(actual[anchor] + m.runTokens*(i-anchor));
  }

  charts.pace = new Chart(ctx, {
    type:'line',
    data:{ labels:dates.map(fmtDate), datasets:[
      { label:'Required pace', data:required, borderColor:'#B7BCC4', borderWidth:1.5, borderDash:[2,4], pointRadius:0, tension:0 },
      { label:'Projection at current rate', data:projection, borderColor:'#E2352F', borderWidth:2, borderDash:[6,4], pointRadius:0, tension:.15 },
      { label:'Tokens banked', data:actual, borderColor:'#1E9E5A', backgroundColor:'rgba(30,158,90,.16)', borderWidth:2.5, fill:true, pointRadius:0, tension:.25 }
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
      plugins:{ legend:legendOpts, tooltip:tipOpts },
      scales:{ x:{ ticks:{ maxTicksLimit:9, color:'#9AA1AC', font:{ family:"'Inter', sans-serif", size:10 } }, grid:{ color:GRID } },
               y:{ beginAtZero:true, ticks:{ color:'#9AA1AC' }, grid:{ color:GRID } } } }
  });
}

function drawDaily(entries){
  const ctx = document.getElementById('cDaily'); if(!ctx) return;
  if(!entries.length) return;
  const end = entries[entries.length-1].date;
  const start = daysBetween(entries[0].date, end) > 20 ? addDays(end,-20) : entries[0].date;
  const byDate = {}; entries.forEach(e => byDate[e.date] = e);
  const days = [];
  for(let d = start; daysBetween(d, end) >= 0 && days.length < 40; d = addDays(d,1)) days.push(d);
  charts.daily = new Chart(ctx, {
    data:{ labels:days.map(fmtDate), datasets:[
      { type:'bar', label:'Tokens', data:days.map(d => byDate[d] ? byDate[d].tokens.reduce((s,t)=>s+t.count,0) : null), backgroundColor:'#E2352F', borderRadius:4, order:2, yAxisID:'y1' },
      { type:'line', label:'Walk-ins', data:days.map(d => byDate[d] ? byDate[d].walkins : null), borderColor:'#2563EB', backgroundColor:'#2563EB', borderWidth:2, tension:.35, pointRadius:2.5, spanGaps:false, order:1, yAxisID:'y' }
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
      plugins:{ legend:legendOpts, tooltip:tipOpts },
      scales:{ x:{ ticks:{ maxTicksLimit:11, color:'#9AA1AC', font:{ family:"'Inter', sans-serif", size:10 } }, grid:{ color:GRID } },
        y:{ position:'left', beginAtZero:true, ticks:{ color:'#9AA1AC' }, grid:{ color:GRID }, title:{ display:true, text:'Walk-ins', color:'#9AA1AC' } },
        y1:{ position:'right', beginAtZero:true, ticks:{ color:'#9AA1AC' }, grid:{ display:false }, title:{ display:true, text:'Tokens', color:'#9AA1AC' } } } }
  });
}

function drawCumulative(proj, m){
  const ctx = document.getElementById('cCum'); if(!ctx) return;
  let cw = 0, ct = 0;
  const labels = [], w = [], t = [];
  m.entries.forEach(e => {
    cw += e.walkins; ct += e.tokens.reduce((s,x)=>s+x.count,0);
    labels.push(fmtDate(e.date)); w.push(cw); t.push(ct);
  });
  charts.cum = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets:[
      { label:'Walk-ins', data:w, borderColor:'#2563EB', backgroundColor:'rgba(37,99,235,.14)', fill:true, borderWidth:2, pointRadius:0, tension:.25, yAxisID:'y' },
      { label:'Tokens', data:t, borderColor:'#E2352F', backgroundColor:'rgba(226,53,47,.16)', fill:true, borderWidth:2, pointRadius:0, tension:.25, yAxisID:'y1' }
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{ mode:'index', intersect:false },
      plugins:{ legend:legendOpts, tooltip:tipOpts },
      scales:{ x:{ ticks:{ maxTicksLimit:10, color:'#9AA1AC', font:{ family:"'Inter', sans-serif", size:10 } }, grid:{ color:GRID } },
        y:{ position:'left', beginAtZero:true, ticks:{ color:'#9AA1AC' }, grid:{ color:GRID } },
        y1:{ position:'right', beginAtZero:true, ticks:{ color:'#9AA1AC' }, grid:{ display:false } } } }
  });
}
