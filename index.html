function exportCsv(proj, m){
  const rows = [['Date','Weekday','Type','Channel','Configuration','Slab','Executive','Tokens','Value','Walk-ins that day']];
  m.entries.forEach(e => {
    const wd = WEEKDAYS[dObj(e.date).getDay()];
    if(!e.tokens.length && !(e.upgrades||[]).length) rows.push([e.date, wd, 'Token', '', '', '', '', 0, 0, e.walkins]);
    e.tokens.forEach(t => rows.push([e.date, wd, 'Token', t.channel, t.unitType, t.tokenType, t.salesExecutive||'Unassigned',
      t.count, t.count*t.amount, e.walkins]));
    (e.upgrades||[]).forEach(u => rows.push([e.date, wd, 'Upgrade', '', '', u.fromSlab+' to '+u.toSlab,
      u.salesExecutive||'Unassigned', u.count, u.delta, e.walkins]));
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8;' }));
  a.download = `${proj.name.replace(/[^\w-]+/g,'_')}_tokens_${todayISO()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function renderModal(){
  const ov = document.createElement('div');
  ov.className = 'overlay';
  const d = modal.data;
  const ct = d.channelTargets && d.channelTargets.length ? d.channelTargets : defaultChannelTargets();
  const prices = Object.assign({}, DEFAULT_PRICES, d.unitPrices || {});
  const slabs  = Object.assign({}, DEFAULT_SLABS, d.tokenSlabs || {});
  const conv = num((d.assumptions || DEFAULT_ASSUMPTIONS).tokenToBooking);

  ov.innerHTML = `
    <div class="modal">
      <h3>${d.id ? 'Launch settings' : 'New launch'}</h3>
      <p class="p-note" style="margin-bottom:0;">Targets drive the countdown, the pace line and every gap on the board.</p>
      <div class="sect">Basics</div>
      <div class="form-row"><div class="field"><label>Launch name</label><input id="mName" value="${escapeHtml(d.name)}" placeholder="Melizma Phase 2"></div></div>
      <div class="form-row">
        <div class="field"><label>Campaign starts</label><input type="date" id="mLaunch" value="${d.launchDate}"></div>
        <div class="field"><label>Target date</label><input type="date" id="mTarget" value="${d.targetDate}"></div>
      </div>
      <div class="sect">Targets by channel</div>
      <div class="scroll">
        <table class="compact">
          <thead><tr><th>Channel</th><th>Walk-ins</th><th>Tokens</th></tr></thead>
          <tbody>
            ${ct.map((c,i) => `<tr>
              <td>${escapeHtml(c.channel)}</td>
              <td><input type="number" min="0" data-ci="${i}" data-cf="targetWalkins" value="${c.targetWalkins}"></td>
              <td><input type="number" min="0" data-ci="${i}" data-cf="targetTokens" value="${c.targetTokens}"></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="sect">Token slab amounts</div>
      <p class="p-note">What each slab is worth on this launch. Different projects run different amounts, so these are set per launch, not globally. Changing them re-values every token already logged against this launch.</p>
      <div class="scroll">
        <table class="compact">
          <thead><tr><th>Slab</th><th>Amount (₹)</th><th>Terms</th></tr></thead>
          <tbody>
            ${TOKEN_TYPES.map(t => `<tr>
              <td>${t.name}</td>
              <td><input type="number" min="0" step="5000" data-slab="${t.name}" value="${num(slabs[t.name])}"></td>
              <td style="white-space:normal;color:var(--muted-2);font-size:11.5px;max-width:280px;">${t.refundable ? 'Refundable' : 'Non-refundable'}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="sect">Pricing and conversion assumption</div>
      <p class="p-note">Used to turn tokens into a booking-value number. Average agreement value per configuration, and the share of tokens you expect to become bookings.</p>
      <div class="scroll">
        <table class="compact">
          <thead><tr><th>Configuration</th><th>Average price (₹)</th></tr></thead>
          <tbody>
            ${UNIT_TYPES.map(u => `<tr><td>${u}</td><td><input type="number" min="0" step="50000" data-price="${u}" value="${num(prices[u])}"></td></tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="form-row" style="margin-top:12px;">
        <div class="field" style="max-width:220px;"><label>Tokens that become bookings (%)</label><input type="number" min="0" max="100" id="mConv" value="${conv}"></div>
      </div>
      <div class="actions">
        <button class="ghost-btn" id="mCancel">Cancel</button>
        <button class="primary-btn" id="mSave" style="margin-top:0;">${d.id ? 'Save settings' : 'Create launch'}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  document.getElementById('mCancel').onclick = () => { modal = null; render(); };
  document.getElementById('mSave').onclick = () => {
    const name = document.getElementById('mName').value.trim();
    if(!name){ alert('The launch needs a name before it can be saved.'); return; }
    const launchDate = document.getElementById('mLaunch').value;
    const targetDate = document.getElementById('mTarget').value;
    if(!launchDate || !targetDate){ alert('Both a start date and a target date are needed.'); return; }
    if(daysBetween(launchDate, targetDate) < 0){ alert('The target date falls before the start date. Swap them around.'); return; }

    const targetWalkinsByChannel = {}, targetTokensByChannel = {};
    ct.forEach((c,i) => {
      const w = ov.querySelector(`input[data-ci="${i}"][data-cf="targetWalkins"]`);
      const t = ov.querySelector(`input[data-ci="${i}"][data-cf="targetTokens"]`);
      targetWalkinsByChannel[c.channel] = parseInt((w && w.value) || '0', 10) || 0;
      targetTokensByChannel[c.channel]  = parseInt((t && t.value) || '0', 10) || 0;
    });
    const unitPrices = {};
    UNIT_TYPES.forEach(u => {
      const el = ov.querySelector(`input[data-price="${u}"]`);
      unitPrices[u] = parseFloat((el && el.value) || '0') || 0;
    });
    const assumptions = { tokenToBooking: clamp(parseFloat(document.getElementById('mConv').value || '0'), 0, 100) };
    const tokenSlabs = {};
    TOKEN_TYPES.forEach(t => {
      const el = ov.querySelector(`input[data-slab="${t.name}"]`);
      tokenSlabs[t.name] = parseFloat((el && el.value) || '0') || 0;
    });

    const isNew = !d.id;
    modal = null;
    withSaving(async () => {
      const res = await apiPost({ action:'saveProject', project:{ id:d.id, name, launchDate, targetDate,
        targetWalkinsByChannel, targetTokensByChannel, unitPrices, assumptions, tokenSlabs } });
      if(isNew && res && res.id) state.activeProjectId = res.id;
      await loadState();
    });
  };
}

function boot(){
  window.onerror = (msg, src, line, col, err) => {
    pageError = err && err.message ? err.message : String(msg); console.error(err || msg); render();
  };
  window.addEventListener('unhandledrejection', e => {
    pageError = e.reason && e.reason.message ? e.reason.message : String(e.reason); console.error(e.reason); render();
  });
  chartTheme();
  loadState();
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
</html>
