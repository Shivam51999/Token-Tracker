<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Pattern &amp; Countdown Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #0D1117;
    --panel: #141B24;
    --panel-2: #1A2330;
    --line: #2A3340;
    --line-soft: #212B37;
    --amber: #E8A33D;
    --gold: #D4AF37;
    --silver: #B8C4CE;
    --platinum: #7DD3C0;
    --green: #4FB286;
    --red: #E2574C;
    --text: #EDEAE2;
    --muted: #8B93A1;
    --muted-2: #5C6472;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #16202c 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;}
  #app{max-width:1240px; margin:0 auto; padding:28px 20px 90px;}

  /* ---- header / project rail ---- */
  .top{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{width:10px;height:10px;background:var(--amber);border-radius:1px; display:inline-block; transform: rotate(45deg); flex-shrink:0;}
  .brand h1{font-size:18px; font-weight:800; letter-spacing:0.2px; margin:0;}
  .brand .sub{color:var(--muted); font-size:13px;}
  .sync{font-size:12.5px; color:var(--muted-2);}

  .tabs-row{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
  .rail{display:flex; gap:8px; flex-wrap:wrap;}
  .rail button{
    background:var(--panel); border:1px solid var(--line-soft); color:var(--muted);
    padding:9px 14px; border-radius:7px; font-family:'Manrope'; font-size:13.5px; font-weight:600;
    cursor:pointer; transition:border-color .15s, color .15s;
  }
  .rail button.active{color:var(--text); border-color:var(--amber); background:var(--panel-2);}
  .rail button:hover{color:var(--text);}
  .rail .add{color:var(--amber); border-style:dashed;}

  .view-toggle{display:flex; gap:4px; background:var(--panel); border:1px solid var(--line-soft); border-radius:8px; padding:3px;}
  .view-toggle button{
    background:none; border:none; color:var(--muted); padding:7px 13px; border-radius:6px;
    font-family:'Manrope'; font-size:13px; font-weight:700; cursor:pointer;
  }
  .view-toggle button.active{background:var(--amber); color:#1A1300;}

  /* ---- hero countdown ---- */
  .hero{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line); border-radius:12px; padding:26px 26px 22px;
    display:grid; grid-template-columns: 1.3fr 1fr; gap:28px; margin-bottom:18px;
  }
  @media(max-width:760px){ .hero{grid-template-columns:1fr;} }
  .hero-left h2{margin:0 0 4px; font-size:20px; font-weight:800;}
  .hero-left .meta{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .countdown{display:flex; gap:22px; flex-wrap:wrap;}
  .cd-block{display:flex; flex-direction:column;}
  .cd-num{font-size:44px; font-weight:600; line-height:1; color:var(--amber); text-shadow:0 0 18px rgba(232,163,61,.35);}
  .cd-num.ticking{font-size:38px; letter-spacing:1px;}
  .cd-num.ticking .seg-sep{color:var(--muted-2); font-weight:400; margin:0 1px;}
  .cd-num.ticking .seg-unit{font-size:14px; color:var(--muted-2); font-weight:600; margin-left:3px;}
  .cd-num.behind{color:var(--red);}
  .cd-label{font-size:11px; color:var(--muted-2); margin-top:6px; letter-spacing:.3px;}
  .cd-sub{font-size:11px; color:var(--amber); margin-top:5px; opacity:.85;}
  .pace-note{margin-top:16px; font-size:13px; color:var(--muted); line-height:1.5;}
  .pace-note b{color:var(--text); font-weight:700;}
  .pace-note .ok{color:var(--green); font-weight:700;}
  .pace-note .warn{color:var(--red); font-weight:700;}

  .targets{display:flex; flex-direction:column; gap:14px; justify-content:center;}
  .tgt-row .tgt-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .tgt-row .tgt-top .name{color:var(--muted);}
  .tgt-row .tgt-top .nums{font-size:13px;}
  .tgt-row .tgt-top .nums .have{color:var(--text); font-weight:700;}
  .tgt-row .tgt-top .nums .of{color:var(--muted-2);}
  .bar{height:8px; background:var(--line-soft); border-radius:4px; overflow:hidden;}
  .bar > div{height:100%; background:var(--green); border-radius:4px; transition:width .7s cubic-bezier(.22,.9,.35,1);}
  .bar > div.behind{background:var(--amber);}
  .sync{display:flex; align-items:center; gap:6px;}
  .live-dot{width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0;}
  .live-dot.pulsing{animation:pulseDot 1.8s ease-in-out infinite;}
  @keyframes pulseDot{ 0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(79,178,134,.5);} 50%{opacity:.6; box-shadow:0 0 0 4px rgba(79,178,134,0);} }
  .error-banner{background:#2B1414; border:1px solid var(--red); color:#F5B8B3; border-radius:9px; padding:14px 16px; margin-bottom:18px; font-size:13px; line-height:1.5;}
  .error-banner b{color:#fff;}
  .error-banner .mono{display:block; margin-top:6px; font-size:11.5px; color:#E8A8A3; word-break:break-all;}
  .value-note{font-size:12px; color:var(--muted-2); margin-top:2px;}

  /* ---- section shell ---- */
  .grid2{display:grid; grid-template-columns: 1.15fr .85fr; gap:18px; margin-bottom:18px;}
  .grid3{display:grid; grid-template-columns: 1fr 1fr 1fr; gap:18px; margin-bottom:18px;}
  @media(max-width:900px){ .grid2, .grid3{grid-template-columns:1fr;} }
  .panel{background:var(--panel); border:1px solid var(--line-soft); border-radius:12px; padding:20px;}
  .panel h3{margin:0 0 4px; font-size:14px; font-weight:700; color:var(--text);}
  .panel h3 .cnt{color:var(--muted-2); font-weight:500; font-size:12.5px;}
  .panel .sub-line{color:var(--muted-2); font-size:12px; margin-bottom:14px;}

  /* ---- daily entry form ---- */
  .form-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .field{display:flex; flex-direction:column; gap:5px; flex:1; min-width:100px;}
  .field label{font-size:11px; color:var(--muted); letter-spacing:.2px;}
  .field input, .field select{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:9px 10px; font-family:'Manrope'; font-size:13.5px;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--amber);}
  .token-rows{display:flex; flex-direction:column; gap:8px; margin:12px 0;}
  .token-row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; background:var(--bg); border:1px solid var(--line-soft); border-radius:8px; padding:10px;}
  .token-row .field{min-width:90px;}
  .icon-btn{
    background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px;
    width:34px; height:34px; cursor:pointer; font-size:16px; flex-shrink:0;
  }
  .icon-btn:hover{color:var(--red); border-color:var(--red);}
  .link-btn{background:none; border:none; color:var(--amber); font-size:13px; font-weight:700; cursor:pointer; padding:0; text-align:left;}
  .primary-btn{
    background:var(--amber); color:#1A1300; border:none; border-radius:7px; padding:11px 18px;
    font-weight:800; font-size:13.5px; cursor:pointer; margin-top:6px;
  }
  .primary-btn:hover{filter:brightness(1.08);}
  .primary-btn:disabled{opacity:.5; cursor:default;}
  .ghost-btn{background:none; border:1px solid var(--line); color:var(--muted); border-radius:7px; padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer;}

  /* ---- token type legend ---- */
  .token-legend{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px;}
  @media(max-width:640px){ .token-legend{grid-template-columns:1fr;} }
  .tl-card{border:1px solid var(--line-soft); border-radius:9px; padding:12px; background:var(--bg);}
  .tl-card .tl-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;}
  .tl-card .tl-name{font-weight:800; font-size:13.5px;}
  .tl-card .tl-amt{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:var(--muted);}
  .tl-card .tl-terms{font-size:11.5px; color:var(--muted-2); line-height:1.4;}
  .tl-card.silver .tl-name{color:var(--silver);}
  .tl-card.gold .tl-name{color:var(--gold);}
  .tl-card.platinum .tl-name{color:var(--platinum);}

  /* ---- log list ---- */
  .log-list{display:flex; flex-direction:column; gap:0; max-height:340px; overflow-y:auto;}
  .log-item{padding:12px 0; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; gap:10px;}
  .log-item:last-child{border-bottom:none;}
  .log-item .date{font-size:12.5px; color:var(--muted); min-width:78px;}
  .log-item .stats{font-size:13px; flex:1;}
  .log-item .stats .n{color:var(--amber); font-weight:700;}
  .log-item .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px;}
  .tag{font-size:11px; background:var(--panel-2); border:1px solid var(--line-soft); color:var(--muted); padding:2px 7px; border-radius:100px;}
  .tag.silver{border-color:var(--silver); color:var(--silver);}
  .tag.gold{border-color:var(--gold); color:var(--gold);}
  .tag.platinum{border-color:var(--platinum); color:var(--platinum);}
  .log-item .del{background:none;border:none;color:var(--muted-2);cursor:pointer;font-size:15px;}
  .log-item .del:hover{color:var(--red);}
  .empty{color:var(--muted-2); font-size:13px; padding:20px 0; text-align:center;}

  canvas{max-width:100%;}
  .chart-wrap{position:relative; height:230px;}
  .chart-wrap.small{height:200px;}

  /* ---- breakdown / team table ---- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--muted-2); font-weight:600; font-size:11px; letter-spacing:.3px; padding:0 10px 8px 0; border-bottom:1px solid var(--line-soft);}
  td{padding:9px 10px 9px 0; border-bottom:1px solid var(--line-soft); color:var(--text);}
  tr:last-child td{border-bottom:none;}
  td.n{color:var(--amber); font-weight:700; text-align:right;}
  td.pct, td.right{color:var(--muted); text-align:right;}
  .rank{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--panel-2); color:var(--muted); font-size:11px; font-weight:700; margin-right:8px;}
  .rank.top{background:var(--amber); color:#1A1300;}

  /* ---- modal ---- */
  .overlay{position:fixed; inset:0; background:rgba(8,10,13,.7); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:24px; width:100%; max-width:420px;}
  .modal h3{margin:0 0 16px;}
  .modal .form-row{flex-direction:column;}
  .modal .actions{display:flex; gap:10px; margin-top:16px; justify-content:flex-end;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// Deployed Apps Script Web App URL (Google Sheets backend)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySTP4F2NBviqwWjx7Uq4BLS24edcWUpUf8503CKBfyG0nBBGk0pmibhzrVztubt9uv/exec';

const UNIT_TYPES = ['1BHK','1.5BHK','2BHK','2.5BHK','3BHK','3.5BHK','4BHK','Shop','Office'];
const CHANNELS = ['CP','Direct Walk-in','Referral','Digital','Hoarding'];
const TOKEN_TYPES = [
  { name:'Silver', key:'silver', amount:50000, terms:'No flat allotted at launch rate — fully refundable on withdrawal.' },
  { name:'Gold', key:'gold', amount:100000, terms:'Flat selection allowed at launch-day offer — 100% refundable.' },
  { name:'Platinum', key:'platinum', amount:200000, terms:'Extra ₹1L discount on launch day, flat selection at launch rate — non-refundable.' }
];
function tokenTypeInfo(name){ return TOKEN_TYPES.find(t=>t.name===name) || TOKEN_TYPES[0]; }

let state = { projects: [], entries: [], activeProjectId: null };
let modal = null;
let loading = true;
let loadError = null;
let saving = false;
let view = 'dashboard'; // 'dashboard' | 'team'
let charts = {}; // keep Chart.js instances so we can destroy before re-render
let pageError = null;   // any uncaught error, shown directly in the UI (no DevTools needed)
let tickHandle = null;  // live countdown interval

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short'});
}
function fmtINR(n){
  return '₹' + Math.round(n).toLocaleString('en-IN');
}
function daysBetween(a,b){
  const A = new Date(a+'T00:00:00'), B = new Date(b+'T00:00:00');
  return Math.round((B-A)/(1000*60*60*24));
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- API ----------
async function apiGet(){
  const res = await fetch(APPS_SCRIPT_URL, { method: 'GET' });
  if(!res.ok) throw new Error('GET failed: ' + res.status);
  return res.json();
}
async function apiPost(payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('POST failed: ' + res.status);
  const data = await res.json();
  if(data && data.ok === false) throw new Error(data.error || 'Request failed');
  return data;
}

async function loadState(){
  loading = true; loadError = null; render();
  try{
    const data = await apiGet();
    state.projects = data.projects || [];
    state.entries = data.entries || [];
    if(!state.activeProjectId || !state.projects.find(p=>p.id===state.activeProjectId)){
      state.activeProjectId = state.projects[0] ? state.projects[0].id : null;
    }
  }catch(e){
    loadError = e.message || String(e);
  }
  loading = false;
  render();
}

async function withSaving(fn){
  saving = true; render();
  try{ await fn(); }
  catch(e){ alert('Could not save to the sheet: ' + (e.message||e)); }
  saving = false; render();
}

function activeProject(){
  return state.projects.find(p => p.id === state.activeProjectId) || null;
}
function entriesFor(projectId){
  return state.entries.filter(e => e.projectId === projectId).sort((a,b)=> a.date.localeCompare(b.date));
}

// ---------- computed metrics ----------
function computeMetrics(project){
  const entries = entriesFor(project.id);
  const totalWalkins = entries.reduce((s,e)=> s + (e.walkins||0), 0);
  const totalTokens = entries.reduce((s,e)=> s + e.tokens.reduce((ss,t)=> ss + (t.count||0),0), 0);
  const totalValue = entries.reduce((s,e)=> s + e.tokens.reduce((ss,t)=> ss + (t.count||0) * tokenTypeInfo(t.tokenType).amount, 0), 0);
  const today = todayISO();
  const daysRemaining = daysBetween(today, project.targetDate);
  const avgWalkinsPerDay = entries.length ? (totalWalkins / Math.max(1, entries.length)) : 0;
  const avgTokensPerDay = entries.length ? (totalTokens / Math.max(1, entries.length)) : 0;
  const walkinsRemaining = Math.max(0, project.targetWalkins - totalWalkins);
  const tokensRemaining = Math.max(0, project.targetTokens - totalTokens);
  const reqWalkinsPerDay = daysRemaining > 0 ? (walkinsRemaining / daysRemaining) : (walkinsRemaining > 0 ? walkinsRemaining : 0);
  const reqTokensPerDay = daysRemaining > 0 ? (tokensRemaining / daysRemaining) : (tokensRemaining > 0 ? tokensRemaining : 0);
  const onPaceTokens = avgTokensPerDay >= reqTokensPerDay || tokensRemaining === 0;
  const conversion = totalWalkins > 0 ? (totalTokens/totalWalkins*100) : 0;
  return { entries, totalWalkins, totalTokens, totalValue, daysRemaining, avgWalkinsPerDay, avgTokensPerDay,
    walkinsRemaining, tokensRemaining, reqWalkinsPerDay, reqTokensPerDay, onPaceTokens, conversion };
}

function breakdownByType(entries){
  const rows = TOKEN_TYPES.map(t => ({ name:t.name, key:t.key, count:0, value:0 }));
  entries.forEach(e => e.tokens.forEach(t => {
    const row = rows.find(r=>r.name===t.tokenType);
    if(row){ row.count += t.count; row.value += t.count * tokenTypeInfo(t.tokenType).amount; }
  }));
  return rows;
}
function breakdownByChannel(entries){
  const map = {};
  entries.forEach(e => e.tokens.forEach(t => { map[t.channel] = (map[t.channel]||0) + t.count; }));
  return Object.entries(map).map(([channel,count])=>({channel,count})).sort((a,b)=>b.count-a.count);
}
function breakdownDetail(entries){
  const map = {};
  entries.forEach(e => {
    e.tokens.forEach(t => {
      const key = [t.unitType||'—', t.channel||'—', t.tokenType||'—'].join(' | ');
      map[key] = (map[key]||0) + (t.count||0);
    });
  });
  const rows = Object.entries(map).map(([key, count]) => {
    const [unitType, channel, tokenType] = key.split(' | ');
    return { unitType, channel, tokenType, count };
  });
  rows.sort((a,b)=> b.count - a.count);
  return rows;
}
function teamPerformance(entries){
  const map = {};
  entries.forEach(e => e.tokens.forEach(t => {
    const name = (t.salesExecutive || 'Unassigned').trim() || 'Unassigned';
    if(!map[name]) map[name] = { name, tokens:0, value:0, silver:0, gold:0, platinum:0, activeDates:new Set() };
    map[name].tokens += t.count;
    map[name].value += t.count * tokenTypeInfo(t.tokenType).amount;
    map[name].activeDates.add(e.date);
    const k = tokenTypeInfo(t.tokenType).key;
    map[name][k] = (map[name][k]||0) + t.count;
  }));
  const totalTokens = Object.values(map).reduce((s,r)=>s+r.tokens,0);
  return Object.values(map).map(r => ({
    ...r,
    activeDays: r.activeDates.size,
    tokensPerActiveDay: r.activeDates.size ? r.tokens / r.activeDates.size : 0,
    valuePerToken: r.tokens ? r.value / r.tokens : 0,
    shareOfTeam: totalTokens ? (r.tokens / totalTokens * 100) : 0
  })).sort((a,b)=> b.tokens - a.tokens);
}
function allExecNames(){
  const set = new Set();
  state.entries.forEach(e => e.tokens.forEach(t => { if(t.salesExecutive) set.add(t.salesExecutive); }));
  return Array.from(set);
}

// ---------- rendering ----------
function destroyCharts(){
  Object.values(charts).forEach(c => { try{ c.destroy(); }catch(e){} });
  charts = {};
}

// Public entry point: never lets an exception pass silently. If anything inside
// throws, the error is shown directly on the page instead of only in DevTools.
function render(){
  stopLiveClock();
  try{
    renderInner();
    if(pageError) injectErrorBanner();
  }catch(err){
    pageError = (err && err.message) ? err.message : String(err);
    console.error(err);
    try{ injectErrorBanner(); }catch(e2){ /* nothing more we can safely do */ }
  }
}

function injectErrorBanner(){
  const bodyEl = document.getElementById('body');
  if(!bodyEl) return;
  if(document.getElementById('pageErrorBanner')) return; // already showing
  const div = document.createElement('div');
  div.id = 'pageErrorBanner';
  div.className = 'error-banner';
  div.innerHTML = `<b>Something broke while rendering.</b> Screenshot this box and send it over — it tells us exactly what to fix. <span class="link-btn" id="dismissError" style="display:inline;">dismiss</span><span class="mono">${escapeHtml(pageError)}</span>`;
  bodyEl.prepend(div);
  document.getElementById('dismissError').onclick = () => { pageError = null; render(); };
}

function renderInner(){
  let app = document.getElementById('app');
  if(!app){
    app = document.createElement('div');
    app.id = 'app';
    document.body.appendChild(app);
  }
  destroyCharts();

  const proj = activeProject();

  app.innerHTML = `
    <div class="top">
      <div class="brand"><span class="mark"></span><div><h1>Token Pattern &amp; Countdown Tracker</h1><div class="sub">Daily walk-in &amp; token pace against launch targets</div></div></div>
      <div class="sync" id="syncStatus"></div>
    </div>
    <div class="tabs-row">
      <div class="rail" id="rail"></div>
      <div class="view-toggle" id="viewToggle">
        <button data-v="dashboard" class="${view==='dashboard'?'active':''}">Launch dashboard</button>
        <button data-v="team" class="${view==='team'?'active':''}">Team performance</button>
      </div>
    </div>
    <div id="body"></div>
  `;

  const syncEl = document.getElementById('syncStatus');
  if(loading) syncEl.innerHTML = `<span class="live-dot" style="background:var(--muted-2)"></span>Loading from sheet…`;
  else if(saving) syncEl.innerHTML = `<span class="live-dot" style="background:var(--amber)"></span>Saving…`;
  else if(loadError) syncEl.innerHTML = `<span class="live-dot" style="background:var(--red)"></span><span style="color:var(--red)">Couldn't reach the sheet: ${escapeHtml(loadError)}</span>`;
  else syncEl.innerHTML = `<span class="live-dot pulsing"></span>Synced`;

  document.querySelectorAll('#viewToggle button').forEach(b=>{
    b.onclick = () => { view = b.dataset.v; render(); };
  });

  renderRail();

  if(loading && state.projects.length===0 && !loadError){
    document.getElementById('body').innerHTML = `<div class="panel"><div class="empty">Loading…</div></div>`;
    syncOverlay();
    return;
  }
  if(!proj){
    document.getElementById('body').innerHTML = `<div class="panel"><div class="empty">No launches yet. Add a project to start tracking.</div></div>`;
    syncOverlay();
    return;
  }

  if(view === 'team') renderTeamView(proj);
  else renderDashboard(proj);

  syncOverlay();
}

function startLiveClock(){
  stopLiveClock();
  const el = document.getElementById('liveClock');
  if(!el) return;
  function tick(){
    const now = new Date();
    const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
    let diff = Math.max(0, endOfToday - now);
    const h = Math.floor(diff/3600000); diff -= h*3600000;
    const mi = Math.floor(diff/60000); diff -= mi*60000;
    const s = Math.floor(diff/1000);
    el.textContent = `${String(h).padStart(2,'0')}h ${String(mi).padStart(2,'0')}m ${String(s).padStart(2,'0')}s left today`;
  }
  tick();
  tickHandle = setInterval(tick, 1000);
}
function stopLiveClock(){
  if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
}

function syncOverlay(){
  const existing = document.querySelector('.overlay');
  if(existing) existing.remove();
  if(modal) renderModal();
}

function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  state.projects.forEach(p => {
    const btn = document.createElement('button');
    btn.textContent = p.name;
    btn.className = p.id === state.activeProjectId ? 'active' : '';
    btn.onclick = () => { state.activeProjectId = p.id; render(); };
    rail.appendChild(btn);
  });
  const add = document.createElement('button');
  add.className = 'add';
  add.textContent = '+ New launch';
  add.onclick = () => { modal = {type:'project', data:{ id:null, name:'', launchDate: todayISO(), targetDate: todayISO(), targetWalkins:100, targetTokens:20 }}; render(); };
  rail.appendChild(add);
}

// Runs fn, and if it throws, records the error for the banner without stopping
// the rest of the dashboard (buttons, forms, other charts) from rendering.
function safely(fn){
  try{ fn(); }
  catch(err){ pageError = (err && err.message) ? err.message : String(err); console.error(err); }
}

let draftTokenRows = [{ unitType: UNIT_TYPES[0], channel: CHANNELS[0], tokenType: TOKEN_TYPES[0].name, salesExecutive:'', count: 1 }];
let draftDate = null;   // non-null while editing an existing day's entry
let draftWalkins = 0;

function renderEntryForm(proj){
  const el = document.getElementById('entryForm');
  const execOptions = allExecNames().map(n=>`<option value="${escapeHtml(n)}">`).join('');
  const editing = !!draftDate;
  el.innerHTML = `
    <datalist id="execList">${execOptions}</datalist>
    ${editing ? `<div class="sub-line" style="color:var(--amber)">Editing ${fmtDate(draftDate)} — <span class="link-btn" id="cancelEdit" style="display:inline;color:var(--muted)">cancel</span></div>` : ''}
    <div class="form-row">
      <div class="field"><label>Date</label><input type="date" id="fDate" value="${draftDate || todayISO()}"></div>
      <div class="field"><label>Walk-ins</label><input type="number" id="fWalkins" min="0" value="${draftWalkins}"></div>
    </div>
    <div class="token-rows" id="tokenRows"></div>
    <button class="link-btn" id="addTokenRow">+ add token type</button>
    <br>
    <button class="primary-btn" id="saveEntry" ${saving?'disabled':''}>${saving?'Saving…': editing ? 'Save changes' : "Save today's entry"}</button>
  `;
  renderTokenRows();
  if(editing){
    document.getElementById('cancelEdit').onclick = () => {
      draftDate = null; draftWalkins = 0;
      draftTokenRows = [{ unitType: UNIT_TYPES[0], channel: CHANNELS[0], tokenType: TOKEN_TYPES[0].name, salesExecutive:'', count: 1 }];
      render();
    };
  }
  document.getElementById('addTokenRow').onclick = () => {
    draftTokenRows.push({ unitType: UNIT_TYPES[0], channel: CHANNELS[0], tokenType: TOKEN_TYPES[0].name, salesExecutive:'', count: 1 });
    renderTokenRows();
  };
  document.getElementById('saveEntry').onclick = () => {
    const date = document.getElementById('fDate').value || todayISO();
    const walkins = parseInt(document.getElementById('fWalkins').value || '0', 10);
    const tokens = draftTokenRows
      .map(r => ({...r, count: parseInt(r.count||0,10)}))
      .filter(r => r.count > 0);
    withSaving(async () => {
      await apiPost({ action: 'saveEntry', entry: { projectId: proj.id, date, walkins, tokens } });
      draftDate = null; draftWalkins = 0;
      draftTokenRows = [{ unitType: UNIT_TYPES[0], channel: CHANNELS[0], tokenType: TOKEN_TYPES[0].name, salesExecutive:'', count: 1 }];
      await loadState();
    });
  };
}

function renderTokenRows(){
  const wrap = document.getElementById('tokenRows');
  wrap.innerHTML = '';
  draftTokenRows.forEach((row, i) => {
    const div = document.createElement('div');
    div.className = 'token-row';
    div.innerHTML = `
      <div class="field"><label>Unit type</label>
        <select data-i="${i}" data-k="unitType">${UNIT_TYPES.map(u=>`<option ${row.unitType===u?'selected':''}>${u}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Channel</label>
        <select data-i="${i}" data-k="channel">${CHANNELS.map(c=>`<option ${row.channel===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Token type</label>
        <select data-i="${i}" data-k="tokenType">${TOKEN_TYPES.map(t=>`<option ${row.tokenType===t.name?'selected':''}>${t.name}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Sales executive</label>
        <input data-i="${i}" data-k="salesExecutive" list="execList" placeholder="e.g. Rohan" value="${escapeHtml(row.salesExecutive)}">
      </div>
      <div class="field" style="max-width:80px;"><label>Count</label>
        <input type="number" min="0" data-i="${i}" data-k="count" value="${row.count}">
      </div>
      <button class="icon-btn" data-del="${i}" title="remove row">×</button>
    `;
    wrap.appendChild(div);
  });
  wrap.querySelectorAll('select, input').forEach(elm => {
    elm.onchange = (e) => {
      const i = +e.target.dataset.i, k = e.target.dataset.k;
      draftTokenRows[i][k] = e.target.value;
    };
  });
  wrap.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = (e) => {
      const i = +e.target.dataset.del;
      draftTokenRows.splice(i,1);
      if(draftTokenRows.length===0) draftTokenRows.push({ unitType: UNIT_TYPES[0], channel: CHANNELS[0], tokenType: TOKEN_TYPES[0].name, salesExecutive:'', count: 1 });
      renderTokenRows();
    };
  });
}

function renderLogList(entries, projectId){
  const el = document.getElementById('logList');
  if(entries.length===0){ el.innerHTML = `<div class="empty">No entries logged yet.</div>`; return; }
  el.innerHTML = entries.slice().reverse().map(e => {
    const tCount = e.tokens.reduce((s,t)=>s+t.count,0);
    const tags = e.tokens.map(t => `<span class="tag ${tokenTypeInfo(t.tokenType).key}">${escapeHtml(t.unitType)} · ${escapeHtml(t.channel)} · ${escapeHtml(t.tokenType)}${t.salesExecutive?' · '+escapeHtml(t.salesExecutive):''} ×${t.count}</span>`).join('');
    return `
      <div class="log-item">
        <div class="date mono">${fmtDate(e.date)}</div>
        <div class="stats">
          <span class="n">${e.walkins}</span> walk-ins &nbsp;·&nbsp; <span class="n">${tCount}</span> tokens
          <div class="tags">${tags}</div>
        </div>
        <button class="link-btn" data-edit="${e.id}" style="font-size:12px;">edit</button>
        <button class="del" data-id="${e.id}">×</button>
      </div>
    `;
  }).join('');
  el.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = (ev) => {
      const id = ev.target.dataset.edit;
      const entry = entries.find(e => e.id === id);
      if(!entry) return;
      draftDate = entry.date;
      draftWalkins = entry.walkins;
      draftTokenRows = entry.tokens.length
        ? entry.tokens.map(t => ({...t}))
        : [{ unitType: UNIT_TYPES[0], channel: CHANNELS[0], tokenType: TOKEN_TYPES[0].name, salesExecutive:'', count: 1 }];
      render();
      document.getElementById('entryForm').scrollIntoView({ behavior:'smooth', block:'center' });
    };
  });
  el.querySelectorAll('.del').forEach(btn=>{
    btn.onclick = (ev) => {
      const id = ev.target.dataset.id;
      withSaving(async () => {
        await apiPost({ action: 'deleteEntry', entryId: id });
        await loadState();
      });
    };
  });
}

function renderDailyChart(entries){
  const ctx = document.getElementById('chartDaily');
  const recent = entries.slice(-14);
  const labels = recent.map(e => fmtDate(e.date));
  const walkins = recent.map(e => e.walkins);
  const tokens = recent.map(e => e.tokens.reduce((s,t)=>s+t.count,0));
  charts.daily = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        { type:'bar', label:'Tokens', data:tokens, backgroundColor:'#E8A33D', borderRadius:4, order:2, yAxisID:'y1' },
        { type:'line', label:'Walk-ins', data:walkins, borderColor:'#8B93A1', backgroundColor:'#8B93A1', tension:.35, pointRadius:3, order:1, yAxisID:'y' }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{ labels:{ color:'#8B93A1', font:{family:'Manrope'} } } },
      scales:{
        x:{ ticks:{ color:'#5C6472', font:{family:'IBM Plex Mono', size:10} }, grid:{ color:'#212B37' } },
        y:{ position:'left', ticks:{ color:'#5C6472' }, grid:{ color:'#212B37' }, title:{display:true,text:'Walk-ins',color:'#5C6472'} },
        y1:{ position:'right', ticks:{ color:'#5C6472' }, grid:{ display:false }, title:{display:true,text:'Tokens',color:'#5C6472'} }
      }
    }
  });
}

function renderTokenMixChart(typeRows){
  const ctx = document.getElementById('chartTokenMix');
  const total = typeRows.reduce((s,r)=>s+r.count,0);
  charts.mix = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels: typeRows.map(r=>r.name),
      datasets:[{ data: typeRows.map(r=>r.count), backgroundColor:['#B8C4CE','#D4AF37','#7DD3C0'], borderColor:'#141B24', borderWidth:2 }]
    },
    options:{
      responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{
        legend:{ position:'bottom', labels:{ color:'#8B93A1', font:{family:'Manrope'}, padding:14 } },
        tooltip:{ callbacks:{ label: (c)=> `${c.label}: ${c.raw} tokens (${total?Math.round(c.raw/total*100):0}%)` } }
      }
    }
  });
}

function renderChannelChart(channelRows){
  const ctx = document.getElementById('chartChannel');

      labels: channelRows.map(r=>r.channel),
      datasets:[{ data: channelRows.map(r=>r.count), backgroundColor:'#4FB286', borderRadius:5 }]

    options:{

      plugins:{ legend:{ display:false } },

        x:{ ticks:{ color:'#5C6472' }, grid:{ color:'#212B37' } },
        y:{ ticks:{ color:'#8B93A1', font:{family:'Manrope'} }, grid:{ display:false } }

function renderBreakdownTable(rows){
  const el = document.getElementById('breakdownTable');
  if(rows.length===0){ el.innerHTML = `<div class="empty">No tokens logged yet.</div>`; return; }
  const total = rows.reduce((s,r)=>s+r.count,0);
  el.innerHTML = `
    <table>
      <thead><tr><th>Unit</th><th>Channel</th><th>Type</th><th style="text-align:right">Count</th><th style="text-align:right">%</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${escapeHtml(r.unitType)}</td><td>${escapeHtml(r.channel)}</td><td>${escapeHtml(r.tokenType)}</td><td class="n">${r.count}</td><td class="pct">${((r.count/total)*100).toFixed(0)}%</td></tr>`).join('')}
      </tbody>
    </table>
  `;
}

// ---------- modal ----------
function renderModal(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const d = modal.data;
  overlay.innerHTML = `
    <div class="modal">
      <h3>${d.id ? 'Edit launch' : 'New launch'}</h3>
      <div class="form-row"><div class="field"><label>Project name</label><input id="mName" value="${escapeHtml(d.name)}" placeholder="e.g. Melizma Phase 2"></div></div>
      <div class="form-row"><div class="field"><label>Launch date</label><input type="date" id="mLaunch" value="${d.launchDate}"></div></div>
      <div class="form-row"><div class="field"><label>Target date (countdown ends)</label><input type="date" id="mTarget" value="${d.targetDate}"></div></div>
      <div class="form-row">
        <div class="field"><label>Target walk-ins</label><input type="number" id="mWalkins" value="${d.targetWalkins}"></div>
        <div class="field"><label>Target tokens</label><input type="number" id="mTokens" value="${d.targetTokens}"></div>
      </div>
      <div class="actions">
        <button class="ghost-btn" id="mCancel">Cancel</button>
        <button class="primary-btn" id="mSave">${d.id ? 'Save changes' : 'Create launch'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('mCancel').onclick = () => { modal = null; render(); };
  document.getElementById('mSave').onclick = () => {
    const name = document.getElementById('mName').value.trim();
    if(!name){ alert('Give the launch a name.'); return; }
    const payload = {
      name,
      launchDate: document.getElementById('mLaunch').value,
      targetDate: document.getElementById('mTarget').value,
      targetWalkins: parseInt(document.getElementById('mWalkins').value||'0',10),
      targetTokens: parseInt(document.getElementById('mTokens').value||'0',10),
    };
    const willBeNew = !d.id;
    modal = null;
    withSaving(async () => {
      const res = await apiPost({ action: 'saveProject', project: { id: d.id, ...payload } });
      if(willBeNew) state.activeProjectId = res.id;
      await loadState();
    });
  };
}

function boot(){
  window.onerror = (msg, src, line, col, err) => {
    pageError = err && err.message ? err.message : String(msg);
    console.error(err || msg);
    render();
  };
  window.addEventListener('unhandledrejection', (e) => {
    pageError = e.reason && e.reason.message ? e.reason.message : String(e.reason);
    console.error(e.reason);
    render();
  });
  loadState();
  window.addEventListener('resize', () => { if(activeProject()) render(); });
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
