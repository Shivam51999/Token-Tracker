<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token Pattern &amp; Countdown Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10141A;
    --panel: #171D26;
    --panel-2: #1D2530;
    --line: #2A3340;
    --line-soft: #232B36;
    --amber: #E8A33D;
    --amber-dim: #7A5A28;
    --green: #4FB286;
    --red: #E2574C;
    --text: #EDEAE2;
    --muted: #8B93A1;
    --muted-2: #5C6472;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric: tabular-nums;}
  #app{max-width:1180px; margin:0 auto; padding:28px 20px 80px;}

  /* ---- header / project rail ---- */
  .top{display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .mark{width:10px;height:10px;background:var(--amber);border-radius:1px; display:inline-block; transform: rotate(45deg); flex-shrink:0;}
  .brand h1{font-size:18px; font-weight:800; letter-spacing:0.2px; margin:0;}
  .brand .sub{color:var(--muted); font-size:13px;}

  .rail{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .rail button{
    background:var(--panel); border:1px solid var(--line-soft); color:var(--muted);
    padding:9px 14px; border-radius:7px; font-family:'Manrope'; font-size:13.5px; font-weight:600;
    cursor:pointer; transition:border-color .15s, color .15s;
  }
  .rail button.active{color:var(--text); border-color:var(--amber); background:var(--panel-2);}
  .rail button:hover{color:var(--text);}
  .rail .add{color:var(--amber); border-style:dashed;}

  /* ---- hero countdown ---- */
  .hero{
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line); border-radius:12px; padding:26px 26px 22px;
    display:grid; grid-template-columns: 1.3fr 1fr; gap:28px; margin-bottom:18px;
  }
  @media(max-width:760px){ .hero{grid-template-columns:1fr;} }
  .hero-left h2{margin:0 0 4px; font-size:20px; font-weight:800;}
  .hero-left .meta{color:var(--muted); font-size:13px; margin-bottom:18px;}
  .countdown{display:flex; gap:22px;}
  .cd-block{display:flex; flex-direction:column;}
  .cd-num{font-size:44px; font-weight:600; line-height:1; color:var(--amber);}
  .cd-num.behind{color:var(--red);}
  .cd-label{font-size:11px; color:var(--muted-2); margin-top:6px; letter-spacing:.3px;}
  .pace-note{margin-top:16px; font-size:13px; color:var(--muted); line-height:1.5;}
  .pace-note b{color:var(--text); font-weight:700;}
  .pace-note .ok{color:var(--green); font-weight:700;}
  .pace-note .warn{color:var(--red); font-weight:700;}

  .targets{display:flex; flex-direction:column; gap:14px; justify-content:center;}
  .tgt-row .tgt-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .tgt-row .tgt-top .name{color:var(--muted);}
  .tgt-row .tgt-top .nums{font-size:13px;}
  .tgt-row .tgt-top .nums .have{color:var(--text); font-weight:700;}
  .tgt-row .tgt-top .nums .of{color:var(--muted-2);}
  .bar{height:8px; background:var(--line-soft); border-radius:4px; overflow:hidden;}
  .bar > div{height:100%; background:var(--green); border-radius:4px;}
  .bar > div.behind{background:var(--amber);}

  /* ---- section shell ---- */
  .grid2{display:grid; grid-template-columns: 1.15fr .85fr; gap:18px; margin-bottom:18px;}
  @media(max-width:900px){ .grid2{grid-template-columns:1fr;} }
  .panel{background:var(--panel); border:1px solid var(--line-soft); border-radius:12px; padding:20px;}
  .panel h3{margin:0 0 14px; font-size:14px; font-weight:700; color:var(--text);}
  .panel h3 .cnt{color:var(--muted-2); font-weight:500; font-size:12.5px;}

  /* ---- daily entry form ---- */
  .form-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .field{display:flex; flex-direction:column; gap:5px; flex:1; min-width:100px;}
  .field label{font-size:11px; color:var(--muted); letter-spacing:.2px;}
  .field input, .field select{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:9px 10px; font-family:'Manrope'; font-size:13.5px;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--amber);}
  .token-rows{display:flex; flex-direction:column; gap:8px; margin:12px 0;}
  .token-row{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end;}
  .token-row .field{min-width:90px;}
  .icon-btn{
    background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px;
    width:34px; height:34px; cursor:pointer; font-size:16px; flex-shrink:0;
  }
  .icon-btn:hover{color:var(--red); border-color:var(--red);}
  .link-btn{background:none; border:none; color:var(--amber); font-size:13px; font-weight:700; cursor:pointer; padding:0; text-align:left;}
  .primary-btn{
    background:var(--amber); color:#1A1300; border:none; border-radius:7px; padding:11px 18px;
    font-weight:800; font-size:13.5px; cursor:pointer; margin-top:6px;
  }
  .primary-btn:hover{filter:brightness(1.08);}
  .ghost-btn{background:none; border:1px solid var(--line); color:var(--muted); border-radius:7px; padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer;}

  /* ---- log list ---- */
  .log-list{display:flex; flex-direction:column; gap:0; max-height:340px; overflow-y:auto;}
  .log-item{padding:12px 0; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; gap:10px;}
  .log-item:last-child{border-bottom:none;}
  .log-item .date{font-size:12.5px; color:var(--muted); min-width:78px;}
  .log-item .stats{font-size:13px; flex:1;}
  .log-item .stats .n{color:var(--amber); font-weight:700;}
  .log-item .tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px;}
  .tag{font-size:11px; background:var(--panel-2); border:1px solid var(--line-soft); color:var(--muted); padding:2px 7px; border-radius:100px;}
  .log-item .del{background:none;border:none;color:var(--muted-2);cursor:pointer;font-size:15px;}
  .log-item .del:hover{color:var(--red);}
  .empty{color:var(--muted-2); font-size:13px; padding:20px 0; text-align:center;}

  /* ---- chart ---- */
  canvas{width:100%; display:block;}
  .chart-legend{display:flex; gap:16px; margin-top:10px; font-size:12px; color:var(--muted);}
  .chart-legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:8px;height:8px;border-radius:2px;display:inline-block;}

  /* ---- breakdown table ---- */
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{text-align:left; color:var(--muted-2); font-weight:600; font-size:11px; letter-spacing:.3px; padding:0 10px 8px 0; border-bottom:1px solid var(--line-soft);}
  td{padding:9px 10px 9px 0; border-bottom:1px solid var(--line-soft); color:var(--text);}
  tr:last-child td{border-bottom:none;}
  td.n{color:var(--amber); font-weight:700; text-align:right;}
  td.pct{color:var(--muted); text-align:right;}

  /* ---- modal ---- */
  .overlay{position:fixed; inset:0; background:rgba(8,10,13,.7); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:24px; width:100%; max-width:420px;}
  .modal h3{margin:0 0 16px;}
  .modal .form-row{flex-direction:column;}
  .modal .actions{display:flex; gap:10px; margin-top:16px; justify-content:flex-end;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// Paste the Apps Script Web App URL here after deployment (ends in /exec)
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbySTP4F2NBviqwWjx7Uq4BLS24edcWUpUf8503CKBfyG0nBBGk0pmibhzrVztubt9uv/exec';

const UNIT_TYPES = ['1BHK','1.5BHK','2BHK','2.5BHK','3BHK','3.5BHK','4BHK','Shop','Office'];
const CHANNELS = ['CP','Direct Walk-in','Referral','Digital','Hoarding'];

let state = { projects: [], entries: [], activeProjectId: null };
let modal = null; // {type:'project', data:{...}} or null
let loading = true;
let loadError = null;
let saving = false;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short'});
}
function daysBetween(a,b){
  const A = new Date(a+'T00:00:00'), B = new Date(b+'T00:00:00');
  return Math.round((B-A)/(1000*60*60*24));
}

async function apiGet(){
  const res = await fetch(APPS_SCRIPT_URL, { method: 'GET' });
  if(!res.ok) throw new Error('GET failed: ' + res.status);
  return res.json();
}
// Sent as text/plain to avoid a CORS preflight; Apps Script reads e.postData.contents regardless.
async function apiPost(payload){
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('POST failed: ' + res.status);
  const data = await res.json();
  if(data && data.ok === false) throw new Error(data.error || 'Request failed');
  return data;
}

async function loadState(){
  loading = true; loadError = null; render();
  try{
    const data = await apiGet();
    state.projects = data.projects || [];
    state.entries = data.entries || [];
    if(!state.activeProjectId || !state.projects.find(p=>p.id===state.activeProjectId)){
      state.activeProjectId = state.projects[0] ? state.projects[0].id : null;
    }
  }catch(e){
    loadError = e.message || String(e);
  }
  loading = false;
  render();
}

async function withSaving(fn){
  saving = true; render();
  try{ await fn(); }
  catch(e){ alert('Could not save to the sheet: ' + (e.message||e)); }
  saving = false;
}

function activeProject(){
  return state.projects.find(p => p.id === state.activeProjectId) || null;
}
function entriesFor(projectId){
  return state.entries.filter(e => e.projectId === projectId).sort((a,b)=> a.date.localeCompare(b.date));
}

// ---------- computed metrics ----------
function computeMetrics(project){
  const entries = entriesFor(project.id);
  const totalWalkins = entries.reduce((s,e)=> s + (e.walkins||0), 0);
  const totalTokens = entries.reduce((s,e)=> s + e.tokens.reduce((ss,t)=> ss + (t.count||0),0), 0);
  const today = todayISO();
  const daysRemaining = daysBetween(today, project.targetDate);
  const daysElapsed = Math.max(1, daysBetween(project.launchDate, today) + (daysBetween(project.launchDate, today) >= 0 ? 1 : 0));
  const totalWindow = Math.max(1, daysBetween(project.launchDate, project.targetDate));
  const avgWalkinsPerDay = entries.length ? (totalWalkins / Math.max(1, entries.length)) : 0;
  const avgTokensPerDay = entries.length ? (totalTokens / Math.max(1, entries.length)) : 0;
  const walkinsRemaining = Math.max(0, project.targetWalkins - totalWalkins);
  const tokensRemaining = Math.max(0, project.targetTokens - totalTokens);
  const reqWalkinsPerDay = daysRemaining > 0 ? (walkinsRemaining / daysRemaining) : (walkinsRemaining > 0 ? walkinsRemaining : 0);
  const reqTokensPerDay = daysRemaining > 0 ? (tokensRemaining / daysRemaining) : (tokensRemaining > 0 ? tokensRemaining : 0);
  const onPaceWalkins = avgWalkinsPerDay >= reqWalkinsPerDay || walkinsRemaining === 0;
  const onPaceTokens = avgTokensPerDay >= reqTokensPerDay || tokensRemaining === 0;
  const conversion = totalWalkins > 0 ? (totalTokens/totalWalkins*100) : 0;
  return { entries, totalWalkins, totalTokens, daysRemaining, avgWalkinsPerDay, avgTokensPerDay,
    walkinsRemaining, tokensRemaining, reqWalkinsPerDay, reqTokensPerDay, onPaceWalkins, onPaceTokens, conversion };
}

function breakdown(entries){
  const map = {};
  entries.forEach(e => {
    e.tokens.forEach(t => {
      const key = [t.unitType||'—', t.channel||'—', t.amountSlab||'—'].join(' | ');
      map[key] = (map[key]||0) + (t.count||0);
    });
  });
  const rows = Object.entries(map).map(([key, count]) => {
    const [unitType, channel, amountSlab] = key.split(' | ');
    return { unitType, channel, amountSlab, count };
  });
  rows.sort((a,b)=> b.count - a.count);
  return rows;
}

// ---------- rendering ----------
function render(){
  let app = document.getElementById('app');
  if(!app){
    // Defensive fallback: the container div was missing from the page for some reason
    // (stale deploy, a stray character before it, etc.) — create it so the app still loads.
    app = document.createElement('div');
    app.id = 'app';
    document.body.appendChild(app);
  }

  if(APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    app.innerHTML = `<div class="panel" style="margin-top:20px;"><div class="empty">
      This copy isn't connected to a Google Sheet yet.<br><br>
      Deploy the Apps Script backend, then paste the Web App URL into <span class="mono">APPS_SCRIPT_URL</span> near the top of this file's script tag.
    </div></div>`;
    return;
  }

  const proj = activeProject();

  app.innerHTML = `
    <div class="top">
      <div class="brand"><span class="mark"></span><div><h1>Token Pattern &amp; Countdown Tracker</h1><div class="sub">Daily walk-in &amp; token pace against launch targets</div></div></div>
      <div class="sub" id="syncStatus"></div>
    </div>
    <div class="rail" id="rail"></div>
    <div id="body"></div>
  `;

  const syncEl = document.getElementById('syncStatus');
  if(loading) syncEl.textContent = 'Loading from sheet…';
  else if(saving) syncEl.textContent = 'Saving…';
  else if(loadError) syncEl.innerHTML = `<span style="color:var(--red)">Couldn't reach the sheet: ${escapeHtml(loadError)}</span>`;
  else syncEl.textContent = 'Synced';

  if(loading && state.projects.length===0 && state.entries.length===0){
    document.getElementById('body').innerHTML = `<div class="panel"><div class="empty">Loading…</div></div>`;
    return;
  }

  renderRail();
  if(!proj){
    document.getElementById('body').innerHTML = `<div class="panel"><div class="empty">No launches yet. Add a project to start tracking.</div></div>`;
    if(modal) renderModal();
    return;
  }
  renderBody(proj);
  if(modal) renderModal();
}

function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  state.projects.forEach(p => {
    const btn = document.createElement('button');
    btn.textContent = p.name;
    btn.className = p.id === state.activeProjectId ? 'active' : '';
    btn.onclick = () => { state.activeProjectId = p.id; saveState(); render(); };
    rail.appendChild(btn);
  });
  const add = document.createElement('button');
  add.className = 'add';
  add.textContent = '+ New launch';
  add.onclick = () => { modal = {type:'project', data:{ id:null, name:'', launchDate: todayISO(), targetDate: todayISO(), targetWalkins:100, targetTokens:20 }}; render(); };
  rail.appendChild(add);
}

function renderBody(proj){
  const m = computeMetrics(proj);
  const body = document.getElementById('body');

  const walkinsPct = Math.min(100, Math.round((m.totalWalkins/Math.max(1,proj.targetWalkins))*100));
  const tokensPct = Math.min(100, Math.round((m.totalTokens/Math.max(1,proj.targetTokens))*100));

  body.innerHTML = `
    <div class="hero">
      <div class="hero-left">
        <h2>${escapeHtml(proj.name)}</h2>
        <div class="meta">Launch ${fmtDate(proj.launchDate)} · Target date ${fmtDate(proj.targetDate)}
          &nbsp;·&nbsp; <span class="link-btn" id="editProjBtn" style="font-size:12.5px;">edit</span>
          &nbsp;·&nbsp; <span class="link-btn" id="delProjBtn" style="font-size:12.5px; color:var(--red);">delete launch</span>
        </div>
        <div class="countdown">
          <div class="cd-block">
            <div class="cd-num mono ${m.daysRemaining < 0 ? 'behind' : ''}">${m.daysRemaining >= 0 ? m.daysRemaining : 0}</div>
            <div class="cd-label">DAYS TO TARGET</div>
          </div>
          <div class="cd-block">
            <div class="cd-num mono">${Math.round(m.reqWalkinsPerDay)}</div>
            <div class="cd-label">WALK-INS NEEDED / DAY</div>
          </div>
          <div class="cd-block">
            <div class="cd-num mono">${Math.round(m.reqTokensPerDay*10)/10}</div>
            <div class="cd-label">TOKENS NEEDED / DAY</div>
          </div>
        </div>
        <div class="pace-note">
          Running average: <b>${m.avgWalkinsPerDay.toFixed(1)} walk-ins/day</b> and <b>${m.avgTokensPerDay.toFixed(1)} tokens/day</b>
          (conversion <b>${m.conversion.toFixed(1)}%</b>). Token pace is
          ${m.onPaceTokens ? '<span class="ok">on track</span>' : '<span class="warn">behind required pace</span>'}
          to hit the target by ${fmtDate(proj.targetDate)}.
        </div>
      </div>
      <div class="targets">
        <div class="tgt-row">
          <div class="tgt-top"><span class="name">Walk-ins</span><span class="nums"><span class="have">${m.totalWalkins}</span> <span class="of">/ ${proj.targetWalkins}</span></span></div>
          <div class="bar"><div class="${walkinsPct<50 && m.daysRemaining<Math.max(1,daysBetween(proj.launchDate,proj.targetDate))/2 ? 'behind':''}" style="width:${walkinsPct}%"></div></div>
        </div>
        <div class="tgt-row">
          <div class="tgt-top"><span class="name">Tokens</span><span class="nums"><span class="have">${m.totalTokens}</span> <span class="of">/ ${proj.targetTokens}</span></span></div>
          <div class="bar"><div class="${!m.onPaceTokens ? 'behind':''}" style="width:${tokensPct}%"></div></div>
        </div>
      </div>
    </div>

    <div class="grid2">
      <div class="panel">
        <h3>Log today's numbers <span class="cnt">— add a daily entry</span></h3>
        <div id="entryForm"></div>
      </div>
      <div class="panel">
        <h3>Daily log <span class="cnt">${m.entries.length} day${m.entries.length===1?'':'s'} recorded</span></h3>
        <div class="log-list" id="logList"></div>
      </div>
    </div>

    <div class="grid2">
      <div class="panel">
        <h3>Daily pattern <span class="cnt">walk-ins vs tokens</span></h3>
        <canvas id="chart" height="220"></canvas>
        <div class="chart-legend">
          <span><span class="dot" style="background:var(--muted)"></span>Walk-ins</span>
          <span><span class="dot" style="background:var(--amber)"></span>Tokens</span>
        </div>
      </div>
      <div class="panel">
        <h3>Token mix <span class="cnt">unit type · channel · slab</span></h3>
        <div id="breakdownTable"></div>
      </div>
    </div>
  `;

  document.getElementById('editProjBtn').onclick = () => { modal = {type:'project', data: JSON.parse(JSON.stringify(proj))}; render(); };
  document.getElementById('delProjBtn').onclick = () => {
    if(confirm(`Delete "${proj.name}" and all its logged entries?`)){
      withSaving(async () => {
        await apiPost({ action: 'deleteProject', projectId: proj.id });
        state.activeProjectId = null;
        await loadState();
      });
    }
  };

  renderEntryForm(proj);
  renderLogList(m.entries, proj.id);
  renderChart(m.entries);
  renderBreakdown(breakdown(m.entries));
}

let draftTokenRows = [{ unitType: UNIT_TYPES[0], channel: CHANNELS[0], amountSlab: '', count: 1 }];

function renderEntryForm(proj){
  const el = document.getElementById('entryForm');
  el.innerHTML = `
    <div class="form-row">
      <div class="field"><label>Date</label><input type="date" id="fDate" value="${todayISO()}"></div>
      <div class="field"><label>Walk-ins</label><input type="number" id="fWalkins" min="0" value="0"></div>
    </div>
    <div class="token-rows" id="tokenRows"></div>
    <button class="link-btn" id="addTokenRow">+ add token type</button>
    <br>
    <button class="primary-btn" id="saveEntry">Save today's entry</button>
  `;
  renderTokenRows();
  document.getElementById('addTokenRow').onclick = () => {
    draftTokenRows.push({ unitType: UNIT_TYPES[0], channel: CHANNELS[0], amountSlab: '', count: 1 });
    renderTokenRows();
  };
  document.getElementById('saveEntry').onclick = () => {
    const date = document.getElementById('fDate').value || todayISO();
    const walkins = parseInt(document.getElementById('fWalkins').value || '0', 10);
    const tokens = draftTokenRows
      .map(r => ({...r, count: parseInt(r.count||0,10)}))
      .filter(r => r.count > 0);
    withSaving(async () => {
      await apiPost({ action: 'saveEntry', entry: { projectId: proj.id, date, walkins, tokens } });
      draftTokenRows = [{ unitType: UNIT_TYPES[0], channel: CHANNELS[0], amountSlab: '', count: 1 }];
      await loadState();
    });
  };
}

function renderTokenRows(){
  const wrap = document.getElementById('tokenRows');
  wrap.innerHTML = '';
  draftTokenRows.forEach((row, i) => {
    const div = document.createElement('div');
    div.className = 'token-row';
    div.innerHTML = `
      <div class="field"><label>Unit type</label>
        <select data-i="${i}" data-k="unitType">${UNIT_TYPES.map(u=>`<option ${row.unitType===u?'selected':''}>${u}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Channel</label>
        <select data-i="${i}" data-k="channel">${CHANNELS.map(c=>`<option ${row.channel===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Amount slab</label>
        <input data-i="${i}" data-k="amountSlab" placeholder="e.g. ₹1,00,000" value="${escapeHtml(row.amountSlab)}">
      </div>
      <div class="field" style="max-width:80px;"><label>Count</label>
        <input type="number" min="0" data-i="${i}" data-k="count" value="${row.count}">
      </div>
      <button class="icon-btn" data-del="${i}" title="remove row">×</button>
    `;
    wrap.appendChild(div);
  });
  wrap.querySelectorAll('select, input').forEach(elm => {
    elm.onchange = (e) => {
      const i = +e.target.dataset.i, k = e.target.dataset.k;
      draftTokenRows[i][k] = e.target.value;
    };
  });
  wrap.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = (e) => {
      const i = +e.target.dataset.del;
      draftTokenRows.splice(i,1);
      if(draftTokenRows.length===0) draftTokenRows.push({ unitType: UNIT_TYPES[0], channel: CHANNELS[0], amountSlab: '', count: 1 });
      renderTokenRows();
    };
  });
}

function renderLogList(entries, projectId){
  const el = document.getElementById('logList');
  if(entries.length===0){ el.innerHTML = `<div class="empty">No entries logged yet.</div>`; return; }
  el.innerHTML = entries.slice().reverse().map(e => {
    const tCount = e.tokens.reduce((s,t)=>s+t.count,0);
    const tags = e.tokens.map(t => `<span class="tag">${escapeHtml(t.unitType)} · ${escapeHtml(t.channel)}${t.amountSlab?' · '+escapeHtml(t.amountSlab):''} ×${t.count}</span>`).join('');
    return `
      <div class="log-item">
        <div class="date mono">${fmtDate(e.date)}</div>
        <div class="stats">
          <span class="n">${e.walkins}</span> walk-ins &nbsp;·&nbsp; <span class="n">${tCount}</span> tokens
          <div class="tags">${tags}</div>
        </div>
        <button class="del" data-id="${e.id}">×</button>
      </div>
    `;
  }).join('');
  el.querySelectorAll('.del').forEach(btn=>{
    btn.onclick = (ev) => {
      const id = ev.target.dataset.id;
      withSaving(async () => {
        await apiPost({ action: 'deleteEntry', entryId: id });
        await loadState();
      });
    };
  });
}

function renderChart(entries){
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 500, cssH = 220;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0,0,cssW,cssH);

  if(entries.length === 0){
    ctx.fillStyle = '#5C6472'; ctx.font = '13px Manrope'; ctx.fillText('No data yet — log a few days to see the pattern.', 10, 110);
    return;
  }
  const recent = entries.slice(-14);
  const maxW = Math.max(1, ...recent.map(e=>e.walkins));
  const maxT = Math.max(1, ...recent.map(e=> e.tokens.reduce((s,t)=>s+t.count,0)));
  const maxVal = Math.max(maxW, maxT);
  const padL = 6, padB = 24, padT = 10;
  const chartH = cssH - padB - padT;
  const groupW = (cssW - padL) / recent.length;
  const barW = Math.min(16, groupW/3);

  recent.forEach((e, i) => {
    const gx = padL + i*groupW + groupW/2;
    const w = e.walkins;
    const t = e.tokens.reduce((s,x)=>s+x.count,0);
    const wH = (w/maxVal)*chartH;
    const tH = (t/maxVal)*chartH;
    ctx.fillStyle = '#5C6472';
    ctx.fillRect(gx - barW - 2, padT + (chartH-wH), barW, wH);
    ctx.fillStyle = '#E8A33D';
    ctx.fillRect(gx + 2, padT + (chartH-tH), barW, tH);
    ctx.fillStyle = '#5C6472';
    ctx.font = '10px IBM Plex Mono';
    ctx.textAlign = 'center';
    ctx.fillText(fmtDate(e.date), gx, cssH - 6);
  });
}

function renderBreakdown(rows){
  const el = document.getElementById('breakdownTable');
  if(rows.length===0){ el.innerHTML = `<div class="empty">No tokens logged yet.</div>`; return; }
  const total = rows.reduce((s,r)=>s+r.count,0);
  el.innerHTML = `
    <table>
      <thead><tr><th>Unit</th><th>Channel</th><th>Slab</th><th style="text-align:right">Count</th><th style="text-align:right">%</th></tr></thead>
      <tbody>
        ${rows.map(r => `<tr><td>${escapeHtml(r.unitType)}</td><td>${escapeHtml(r.channel)}</td><td>${escapeHtml(r.amountSlab||'—')}</td><td class="n">${r.count}</td><td class="pct">${((r.count/total)*100).toFixed(0)}%</td></tr>`).join('')}
      </tbody>
    </table>
  `;
}

function renderModal(){
  const existing = document.querySelector('.overlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  const d = modal.data;
  overlay.innerHTML = `
    <div class="modal">
      <h3>${d.id ? 'Edit launch' : 'New launch'}</h3>
      <div class="form-row"><div class="field"><label>Project name</label><input id="mName" value="${escapeHtml(d.name)}" placeholder="e.g. Melizma Phase 2"></div></div>
      <div class="form-row"><div class="field"><label>Launch date</label><input type="date" id="mLaunch" value="${d.launchDate}"></div></div>
      <div class="form-row"><div class="field"><label>Target date (countdown ends)</label><input type="date" id="mTarget" value="${d.targetDate}"></div></div>
      <div class="form-row">
        <div class="field"><label>Target walk-ins</label><input type="number" id="mWalkins" value="${d.targetWalkins}"></div>
        <div class="field"><label>Target tokens</label><input type="number" id="mTokens" value="${d.targetTokens}"></div>
      </div>
      <div class="actions">
        <button class="ghost-btn" id="mCancel">Cancel</button>
        <button class="primary-btn" id="mSave">${d.id ? 'Save changes' : 'Create launch'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('mCancel').onclick = () => { modal = null; render(); };
  document.getElementById('mSave').onclick = () => {
    const name = document.getElementById('mName').value.trim();
    if(!name){ alert('Give the launch a name.'); return; }
    const payload = {
      name,
      launchDate: document.getElementById('mLaunch').value,
      targetDate: document.getElementById('mTarget').value,
      targetWalkins: parseInt(document.getElementById('mWalkins').value||'0',10),
      targetTokens: parseInt(document.getElementById('mTokens').value||'0',10),
    };
    const willBeNew = !d.id;
    modal = null;
    withSaving(async () => {
      const res = await apiPost({ action: 'saveProject', project: { id: d.id, ...payload } });
      if(willBeNew) state.activeProjectId = res.id;
      await loadState();
    });
  };
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function boot(){
  loadState();
  window.addEventListener('resize', () => { if(activeProject()) render(); });
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
